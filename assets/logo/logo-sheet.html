<!doctype html><meta charset="utf-8"><title>RNGC logo sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#050506;color:#eef0f3;font-family:'Barlow Condensed',sans-serif;padding:40px}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 24px}
.row{display:flex;gap:24px;flex-wrap:wrap}.tile{border-radius:20px;padding:36px;display:grid;place-items:center;gap:14px;min-width:300px}
.dark{background:#0a0b0d;border:1px solid #2a2f37}.light{background:#eceff3;color:#0a0b0d}.sil{background:linear-gradient(145deg,#d5dae1,#8e96a2);color:#0a0b0d}
.lock{display:flex;align-items:center;gap:18px}.lock b{display:block;font-weight:800;font-size:44px;letter-spacing:.05em;line-height:.95;text-transform:uppercase}.lock em{display:block;font-style:normal;font-weight:700;font-size:22px;letter-spacing:.32em;opacity:.7;margin-top:6px}
small{font-family:sans-serif;opacity:.6}</style>
<h1>Raider Nation Golf Club - new mark</h1>
<div class="row">
<div class="tile dark"><img src="rngc-mark.svg" width="220"><small>Primary mark</small></div>
<div class="tile dark"><div class="lock"><img src="rngc-mark.svg" width="86"><div><b>Raider Nation</b><em>Golf Club</em></div></div><small>Horizontal lockup</small></div>
<div class="tile sil"><div class="lock"><img src="rngc-mark.svg" width="86"><div><b>Raider Nation</b><em>Golf Club</em></div></div><small>On silver</small></div>
<div class="tile light"><img src="rngc-mark.svg" width="120"><small>On light</small></div>
</div>
