<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hole Map Demo</title>
<style>
:root{--bg:#0b0b0c;--panel:#16171a;--line:#2a2c31;--ink:#f2f3f5;--dim:#9aa0a8;--silver:#d5dae1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{padding:10px 16px 8px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
button.on{background:var(--silver);color:#000;border-color:var(--silver);font-weight:700}
#stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#photo{background:#111 center/contain no-repeat}
#map2d,#map3d{width:100%;height:100%}
gmp-map-3d{width:100%;height:100%;display:block}
.note{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.72);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;pointer-events:none}
.note b{color:var(--silver)}
#fly{position:absolute;right:12px;top:12px;z-index:2;display:none;background:var(--silver);color:#000;font-weight:700}
.err{padding:24px;color:#ffb4b4}
</style>
</head>
<body>
<header>
  <h1>Hole map demo · Chimera</h1>
  <div class="sub" id="hsub"></div>
  <div class="row" id="holes"></div>
  <div class="row" id="modes">
    <button data-m="photo" class="on">Today's photo</button>
    <button data-m="sat">Google satellite</button>
    <button data-m="3d">Google 3D</button>
  </div>
</header>
<div id="stage">
  <div class="view on" id="photo"><div class="note"><b>What the app shows today.</b> Free government aerial photo. Flat, top down, can be a few years old.</div></div>
  <div class="view" id="v2d"><div id="map2d"></div><div class="note"><b>Google satellite.</b> Sharper and newer photo, still flat. Cheaper of the two Google options.</div></div>
  <div class="view" id="v3d"><button id="fly">Fly the hole</button><div id="map3d"></div><div class="note" id="n3d"><b>Google 3D.</b> Drag to turn, pinch to zoom. Tap Fly the hole.</div></div>
</div>
<script src="maps-key.js"></script>
<script>
'use strict';
/* tee and green spots from the app's own Chimera course data; ground height in meters */
const HOLES=[
 {n:1,par:4,tee:[36.078571,-114.96778],green:[36.080708,-114.970811],gz:474,tz:481},
 {n:2,par:5,tee:[36.080922,-114.971495],green:[36.084245,-114.974681],gz:470,tz:471},
 {n:3,par:4,tee:[36.08455,-114.974998],green:[36.08565,-114.971525],gz:465,tz:470}
];
let H=HOLES[0],mode='photo',gm=null,m2=null,m3=null,lib3=null,mk2=[];
const $=s=>document.querySelector(s);
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function bearing([a1,o1],[a2,o2]){const y=Math.sin(rad(o2-o1))*Math.cos(rad(a2)),x=Math.cos(rad(a1))*Math.sin(rad(a2))-Math.sin(rad(a1))*Math.cos(rad(a2))*Math.cos(rad(o2-o1));return (deg(Math.atan2(y,x))+360)%360}
function meters([a1,o1],[a2,o2]){const R=6371000,dl=rad(a2-a1),dn=rad(o2-o1),h=Math.sin(dl/2)**2+Math.cos(rad(a1))*Math.cos(rad(a2))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const yards=h=>Math.round(meters(h.tee,h.green)*1.09361);

/* today's photo: same free source the app uses */
function photo(){const pad=.0012,la=[H.tee[0],H.green[0]],lo=[H.tee[1],H.green[1]];
  const bb=[Math.min(...lo)-pad,Math.min(...la)-pad,Math.max(...lo)+pad,Math.max(...la)+pad].map(v=>v.toFixed(6)).join(',');
  $('#photo').style.backgroundImage=`url("https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?bbox=${bb}&bboxSR=4326&imageSR=4326&size=1200,1200&format=jpg&f=image")`}

/* Google loader, one time */
function google(){return gm||(gm=new Promise((ok,no)=>{if(!window.RNGC_MAPS_KEY)return no(new Error('No Google key on this page.'));
  window.__gm=()=>ok(window.google);window.gm_authFailure=()=>no(new Error('Google refused the key for this page.'));
  const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(window.RNGC_MAPS_KEY)+'&v=beta&loading=async&callback=__gm';s.async=true;s.onerror=()=>no(new Error('Could not load Google Maps.'));document.head.appendChild(s)}))}
const fail=(el,e)=>{el.innerHTML=`<div class="err">${e.message||e}</div>`};

async function sat(){try{const g=await google();
  if(!m2)m2=new g.maps.Map($('#map2d'),{mapTypeId:'satellite',disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy'});
  mk2.forEach(m=>m.setMap(null));
  const b=new g.maps.LatLngBounds();[H.tee,H.green].forEach(p=>b.extend({lat:p[0],lng:p[1]}));m2.fitBounds(b,40);
  mk2=[[H.tee,'T'],[H.green,'G']].map(([p,l])=>new g.maps.Marker({map:m2,position:{lat:p[0],lng:p[1]},label:{text:l,color:'#000',fontWeight:'700'}}));
}catch(e){fail($('#map2d'),e)}}

/* behind the tee, looking down the hole */
const teeCam=()=>{const hd=bearing(H.tee,H.green),mid=[H.tee[0]+(H.green[0]-H.tee[0])*.6,H.tee[1]+(H.green[1]-H.tee[1])*.6];
  return {center:{lat:mid[0],lng:mid[1],altitude:H.gz},range:meters(H.tee,H.green)*.9,tilt:55,heading:hd}};
async function three(){try{await google();
  if(!lib3)lib3=await window.google.maps.importLibrary('maps3d');
  const {Map3DElement,Marker3DElement}=lib3;
  if(!m3){m3=new Map3DElement({...teeCam(),mode:'SATELLITE'});$('#map3d').appendChild(m3);$('#fly').style.display='block'}
  else{m3.stopCameraAnimation&&m3.stopCameraAnimation();m3.flyCameraTo({endCamera:teeCam(),durationMillis:1500})}
  m3.querySelectorAll('gmp-marker-3d').forEach(x=>x.remove());
  [[H.tee,'Tee'],[H.green,'Pin']].forEach(([p,l])=>{const k=new Marker3DElement({position:{lat:p[0],lng:p[1]},altitudeMode:'CLAMP_TO_GROUND',label:l});m3.append(k)});
}catch(e){fail($('#map3d'),e)}}

async function flyHole(){if(!m3)return;const hd=bearing(H.tee,H.green),L=meters(H.tee,H.green);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  m3.flyCameraTo({endCamera:{center:{lat:H.tee[0],lng:H.tee[1],altitude:H.tz},range:90,tilt:72,heading:hd},durationMillis:2500});await wait(2700);
  m3.flyCameraTo({endCamera:{center:{lat:H.green[0],lng:H.green[1],altitude:H.gz},range:Math.max(140,L*.35),tilt:68,heading:hd},durationMillis:5500});await wait(5700);
  m3.flyCameraAround({camera:{center:{lat:H.green[0],lng:H.green[1],altitude:H.gz},range:160,tilt:65,heading:hd},durationMillis:9000,rounds:1})}

function show(){document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  ['photo','v2d','v3d'].forEach(id=>$('#'+id).classList.toggle('on',id===({photo:'photo',sat:'v2d','3d':'v3d'})[mode]));
  $('#hsub').textContent=`Hole ${H.n} · Par ${H.par} · about ${yards(H)} yds tee to green`;
  if(mode==='photo')photo();else if(mode==='sat')sat();else three()}
$('#holes').innerHTML=HOLES.map(h=>`<button data-h="${h.n}" class="${h===H?'on':''}">Hole ${h.n}</button>`).join('');
$('#holes').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;H=HOLES.find(h=>h.n==b.dataset.h);
  document.querySelectorAll('#holes button').forEach(x=>x.classList.toggle('on',x===b));show()});
$('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;show()});
$('#fly').addEventListener('click',flyHole);
show();
</script>
</body>
</html>
