<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Club payments | Raider Nation Golf Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script>
/* Pay links (old store addresses) forward to the club's own store (/store/, Nov 12 2026). */
var MAP={'membership-national-annual':'mem-national','membership-so-cal-chapter-annual':'mem-socal',
 'northern-california-chapter-membership-annual':'mem-norcal','membership-nevada-chapter-annual':'mem-nevada',
 'saturday-november-14th-2026-chimera-golf-club-in-henderson-nevada':'ev-nov14','rngc-golf-polo-the-og-classic':'polo-og'};
var i=(new URLSearchParams(location.search).get('i')||'').replace(/[^a-z0-9\/_-]/gi,'');
var m=i.match(/^product\/([a-z0-9_-]+)/i);
location.replace('/store/'+(m&&MAP[m[1]]?'#/p/'+MAP[m[1]]:''));
</script>
<style>
:root{--bg:#0a0b0d;--panel:#16191e;--line:#2a2f37;--text:#eef0f3;--muted:#9aa2ae;--silver:#d5dae1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Barlow,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
img{width:72px;height:72px}
h1{font:800 30px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:14px 0 10px}
p{color:var(--muted);margin:0 0 14px}
a.btn{display:inline-block;margin-top:8px;padding:13px 22px;border-radius:999px;background:var(--silver);color:#0a0b0d;font-weight:600;text-decoration:none;min-height:44px}
</style></head>
<body><main class="card">
<img src="/assets/logo/rngc-ball-static.svg" alt="Raider Nation Golf Club">
<h1>Online pay is moving</h1>
<p>The club store is moving to its new home this week, so dues, event entries and gear can't be paid online for a few days.</p>
<p>Your spot and your membership are safe. Check back soon, or ask your chapter president.</p>
<a class="btn" href="/">Back to the club app</a>
</main></body></html>
