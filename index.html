<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0b0d">
<title>Raider Nation Golf Club - Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="maps-key.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --bg:#0a0b0d; --bg-2:#111317; --panel:#16191e; --panel-2:#1d2127;
  --line:#2a2f37; --text:#eef0f3; --muted:#9aa2ae; --silver:#d5dae1; --silver-2:#aeb5bf;
  --on-silver:#0a0b0d;
  --r:14px; --r-sm:10px; --pill:999px;
  --display:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050506;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:var(--text)}
select option{background:#16191e;color:#eef0f3}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}

.stage{min-height:100dvh}
.app{position:relative;width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* top bar */
.top{padding:max(14px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#0f1114,var(--bg))}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:46px;flex:none}
.top .logo{width:58px;height:67px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s var(--ease)}
.top .logo:active{transform:scale(.94)}
.brandtxt{flex:1;line-height:1}
.brandtxt b{display:block;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.brandtxt b em{font-style:normal;color:var(--silver-2);font-weight:700;letter-spacing:.22em;font-size:13px;display:block;margin-top:3px}
.brandtxt span{display:none}
.iconbtn{width:44px;height:44px;border-radius:var(--pill);display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:20px;transition:transform .18s var(--ease)}
.iconbtn:active{transform:scale(.94)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;font-weight:600;transition:transform .18s var(--ease),background .2s,color .2s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--silver);color:var(--on-silver);border-color:var(--silver)}
.topjoin{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.selwrap{position:relative;width:100%}
.chsel{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:0 44px 0 16px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:15px;cursor:pointer}
.chsel:hover{border-color:var(--silver-2)}
.selwrap i{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--silver-2)}

.banner{margin:12px 16px 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--panel);border:1px dashed var(--line);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.banner i{font-size:18px;color:var(--silver-2);margin-top:1px}

/* views */
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 28px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .28s var(--ease),transform .28s var(--ease),visibility 0s .28s;overscroll-behavior:contain}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s var(--ease),transform .28s var(--ease)}
h2.sec{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:26px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:-4px 0 12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:10px}
.rise > *{animation:rise .5s var(--ease) both}
.rise > *:nth-child(2){animation-delay:.05s}.rise > *:nth-child(3){animation-delay:.1s}.rise > *:nth-child(4){animation-delay:.15s}.rise > *:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{min-height:48px;padding:0 20px;border-radius:var(--pill);background:var(--silver);color:var(--on-silver);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),filter .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost.on{background:var(--panel-2);border-color:var(--silver-2);color:var(--silver)}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--pill);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--silver-2)}
.meta{font-size:13px;color:var(--muted);margin-top:4px}

/* home hero */
.hero{margin-top:16px;border-radius:22px;position:relative;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;
  background:#14171b}
/* group photo sits on top, framed on the people at the bottom of the shot; words sit below it */
.hero .bg{position:relative;height:230px;background-size:auto 175%;background-repeat:no-repeat;background-position:center 96%;filter:grayscale(.55) contrast(1.05)}
@media (min-width:600px){.hero .bg{height:320px;background-size:cover;background-position:center 92%}}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,13,0) 55%,#14171b 100%)}
.hero::after{content:none}
.hero .in{position:relative;z-index:2;padding:6px 18px 20px;width:100%}
.hero .tag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.hero h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.96;letter-spacing:.01em;text-transform:uppercase;margin:8px 0 8px}
.hero p{color:#c3c9d2;font-size:16px;max-width:46ch}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.next{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px}
.next .cd{font-family:var(--display);font-weight:800;font-size:46px;line-height:.9;text-align:center}
.next .cd small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.next h3{font-family:var(--display);text-transform:uppercase;font-size:22px;line-height:1.05;font-weight:700}

/* membership */
.plans{display:grid;gap:10px}
.plan{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px}
.plan h3{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:700;line-height:1}
.plan .price{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.plan .price small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.plan p{color:var(--muted);font-size:14px;margin-top:6px}
.leaders{display:grid;gap:10px}
.lead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 14px}
.lead img{width:64px;height:64px;object-fit:contain}
.lead b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.05}
.lead span{font-size:14px;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* news */
.news{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:12px;transition:transform .18s var(--ease)}
.news:active{transform:scale(.985)}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;object-position:top;background:var(--panel-2)}
.news h3{font-family:var(--display);font-size:21px;line-height:1.05;font-weight:700;letter-spacing:.01em;text-transform:uppercase}

/* sponsors / shop */
.spons{display:flex;flex-wrap:wrap;gap:10px}
.spon{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--silver)}
.shopcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px}
.shopcard img{width:96px;height:96px;object-fit:cover;border-radius:12px;background:#000}
.shopcard b{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1.05;display:block}
.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.foot a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--silver)}

/* events */
.month{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver-2);margin:22px 0 8px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px}
.ev.past{opacity:.72}
.date{width:58px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);text-align:center;padding:8px 0;align-self:start}
.date b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.date span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ev h3{font-family:var(--display);font-size:23px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.ev .where{font-size:14px;color:var(--muted);margin:4px 0 8px}
.ev .note{font-size:14px;color:#c3c9d2;margin-bottom:10px}
.ev .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .row .grow{flex:1;color:var(--muted);font-size:14px}
.flyers{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.flyers img{flex:none;height:260px;width:auto;border-radius:12px;border:1px solid var(--line);scroll-snap-align:start;background:var(--panel)}

/* map + courses */
.mapbox{height:250px;border-radius:var(--r);border:1px solid var(--line);margin-top:16px;background:var(--bg-2);overflow:hidden}
.leaflet-container{background:#0d0f12;font-family:var(--body)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--silver);border:2px solid #0a0b0d;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.pin i{transform:rotate(45deg);color:#0a0b0d;font-size:14px}
.pin.sel{background:#fff;transform:rotate(-45deg) scale(1.25)}
.pin.me{background:#0a0b0d;border-color:var(--silver)}
.pin.me i{color:var(--silver)}
.pin.trip{background:#fff}
.course{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;transition:transform .18s var(--ease),border-color .2s}
.course:active{transform:scale(.985)}
.course.sel{border-color:var(--silver-2)}
.course .n{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:22px;color:var(--silver)}
.course b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;display:block}
.course small{color:var(--muted);font-size:13px}
.detail{margin-top:12px;display:none}
.detail.on{display:block;animation:rise .35s var(--ease) both}
.detail h3{font-family:var(--display);font-size:26px;text-transform:uppercase;font-weight:800}
.detail p{color:var(--muted);font-size:15px;margin:4px 0 12px}
.detail .acts{display:flex;gap:10px;flex-wrap:wrap}

/* members */
.gate{margin-top:18px;text-align:center;padding:30px 20px}
.gate i{font-size:40px;color:var(--silver)}
.gate h3{font-family:var(--display);font-size:30px;text-transform:uppercase;margin:8px 0}
.gate p{color:var(--muted);max-width:46ch;margin:0 auto 16px}
.gate .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.mtools select{min-height:44px;padding:0 12px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line);flex:1;min-width:170px}
.mem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;transition:transform .18s var(--ease),border-color .2s}
.mem:active{transform:scale(.985)}
.mem b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;display:block}
.mem small{color:var(--muted);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--silver)}
.av.s{width:30px;height:30px;font-size:14px}
.privacy{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;color:var(--muted);font-size:14px;margin-top:12px}
.privacy i{font-size:20px;color:var(--silver-2);margin-top:1px}
.radio{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);margin-top:8px;cursor:pointer}
.radio input{margin-top:3px;width:20px;height:20px;accent-color:#d5dae1}
.radio b{display:block}
.radio span{font-size:14px;color:var(--muted)}
.radio:has(input:checked){border-color:var(--silver-2);background:var(--panel)}

/* demo tour */
.coach{position:absolute;left:12px;right:12px;bottom:80px;z-index:35;background:#e9ecf1;color:#0a0b0d;border-radius:18px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.65);display:none}
.coach.on{display:block;animation:rise .4s var(--ease) both}
.coach .st{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a525d}
.coach h4{font-family:var(--display);font-size:25px;text-transform:uppercase;line-height:1.02;margin:3px 0 4px;font-weight:800}
.coach p{font-size:15px;color:#2b3139}
.coach .cr{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.coach .btn{min-height:44px;background:#0a0b0d;color:#f1f3f6}
.coach .btn.ghost{background:transparent;color:#0a0b0d;border:1px solid #9aa2ae}
.coach .x{margin-left:auto;min-height:44px;padding:0 6px;color:#4a525d;font-weight:600;font-size:14px}
.pill.demo{background:var(--silver);color:var(--on-silver);border-color:var(--silver)}
.spot{position:relative;animation:spot 1.5s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(213,218,225,.0)}50%{box-shadow:0 0 0 5px rgba(213,218,225,.55)}}
@media (min-width:1000px){.coach{left:auto;right:56px;bottom:40px;width:390px}}
/* tickets */
.seg{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.seg .chip{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.tixhead{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.tixgrid{display:grid;gap:12px}
.tix .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tix h3{font-family:var(--display);font-size:23px;text-transform:uppercase;line-height:1.05;font-weight:700}
.tix .deal{display:flex;align-items:baseline;flex-wrap:wrap}
.tix .deal b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.tix .note2{color:#c3c9d2;font-size:14px;margin:8px 0}
.tix .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
@media (min-width:1000px){.tixgrid{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}}
/* games + fantasy */
.recbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.recbar .rec{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;margin-right:4px}
.game{width:100%;text-align:left;transition:transform .18s var(--ease),border-color .2s}
.game:active{transform:scale(.985)}
.game.sel{border-color:var(--silver-2)}
.game .res{font-family:var(--display);font-weight:800;font-size:20px}
.game .res.w{color:#fff}.game .res.l{color:var(--muted)}
.gstack{display:grid;gap:10px}
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.ftable td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ftable td.n{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);width:28px}
.ftable td b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.05}
.ftable td small{color:var(--muted);font-size:12px}
.ftable .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ftable tr.cut td{border-bottom:2px solid var(--silver-2)}
/* club scorecards */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 6px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px 14px}
.kpi small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:30px;font-weight:800;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--silver-2)}
.ftable tr[data-sc]{cursor:pointer}
.ftable tr[data-sc]:hover td,.ftable tr[data-sc]:focus-visible td{background:var(--panel-2)}
.ftable tr.me td{background:var(--panel-2)}
.sccard{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums;margin-top:8px}
.sccard th,.sccard td{text-align:center;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)}
.sccard th{color:var(--muted);font-weight:600;font-size:11px}
.sccard th:first-child,.sccard td:first-child{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;width:40px}
.sccard th:last-child,.sccard td:last-child{width:34px;font-weight:800;color:var(--text)}
.sccard .s{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;font-weight:700}
.sccard .s.bd{border:1.5px solid var(--silver);border-radius:50%}
.sccard .s.eg{border:1.5px solid var(--silver);border-radius:50%;box-shadow:0 0 0 2px var(--bg-2),0 0 0 3.5px var(--silver)}
.sccard .s.bo{border:1.5px solid var(--silver-2);border-radius:3px}
.sccard .s.db{border:1.5px solid var(--silver-2);border-radius:3px;box-shadow:0 0 0 2px var(--bg-2),0 0 0 3.5px var(--silver-2)}
.sckey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.sckey span{display:inline-flex;align-items:center;gap:6px}
.sckey i{display:inline-block;width:12px;height:12px}
.sckey .k1{border:1.5px solid var(--silver);border-radius:50%}.sckey .k2{border:1.5px solid var(--silver-2);border-radius:2px}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 14px}
.mu .side b{font-family:var(--display);font-size:17px;text-transform:uppercase;line-height:1.05;display:block}
.mu .side small{color:var(--muted);font-size:12px}
.mu .side.r{text-align:right}
.mu .pts{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}

.mx{width:100%;text-align:left;padding:12px 14px;display:grid;gap:10px;transition:transform .18s var(--ease),border-color .2s}

.tm.r{flex-direction:row-reverse;text-align:right}

.tl{width:40px;height:40px;object-fit:contain;flex:none}

.tm b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sc{display:flex;align-items:center;justify-content:center;gap:10px}
.sc b{font-family:var(--display);font-size:28px;font-weight:800;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums}

.mxbot{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.wl{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-size:15px;font-weight:800;background:var(--panel-2);color:var(--muted);letter-spacing:0}

.wc{display:grid;gap:6px}
.wcl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600}
.wcl b{font-family:var(--display);font-size:20px;color:var(--text)}
.wct{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.wct i{display:block;height:100%;background:linear-gradient(90deg,#9aa2ae,#f4f6f9);border-radius:6px}
.hero2{margin-top:12px;display:grid;gap:14px;padding:16px;background:linear-gradient(160deg,#1c2129,#0d0f12)}
.mxrow.big .tl{width:60px;height:60px}
.mxrow.big .tm,.mxrow.big .tm.r{flex-direction:column;text-align:center;gap:6px}
.mxrow.big .tm b{font-size:21px}
.mxrow.big .ko b{font-size:28px}
.mxrow.big .sc b{font-size:36px}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--silver-2)}

.nw{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:12px}
.nw img{width:96px;height:64px;object-fit:cover;border-radius:10px;background:var(--panel-2)}
.nw b{font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.05;display:block;margin:2px 0 4px}
.nw p{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill.out{border-color:#7a3b3b;color:#f0b4b4}
.tixm{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

@media (max-width:699px){

  .mxrow.big .tm b{font-size:18px}
  .tl{width:36px;height:36px}

/* side menu sub-links (computer layout) */
.subnav{display:none}
@media (min-width:1000px){
  /* the whole left column scrolls as one when the menu is taller than the screen; the page area stays put */
  .app{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .views{position:sticky;top:0;height:100dvh;align-self:start}
  .tabs{align-content:start}
  .app .fab,.app .toast,.app .coach,.app .sheet{position:fixed}
  .subnav{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
  .subnav > div{overflow:hidden;display:grid;gap:2px}
  .subnav.open{grid-template-rows:1fr}
  .subnav.open > div{padding:2px 0 8px}
  .subnav button{position:relative;display:flex;align-items:center;width:100%;min-height:38px;padding:0 14px 0 56px;border-radius:10px;color:var(--muted);font-size:15px;font-weight:600;text-align:left}
  .subnav button::before{content:"";position:absolute;left:28px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--line)}
  .subnav button:hover{background:var(--panel);color:var(--text)}
  .subnav button[aria-current="true"]{color:var(--text)}
  .subnav button[aria-current="true"]::before{background:var(--silver)}
}
.gwrap,.fwrap2{display:block}
@media (min-width:1000px){
  .gwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
  .gwrap .gmain{grid-column:1;grid-row:1}
  .gwrap .gside{grid-column:2;grid-row:1;position:sticky;top:16px}
  .gwrap .mapbox{height:min(400px,48dvh);margin-top:14px}
  .fwrap2{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
  .card.mx:hover,.card.nw:hover{border-color:var(--silver-2)}
}
/* forum */
.thread{width:100%;text-align:left;padding:14px;display:grid;gap:8px;transition:transform .18s var(--ease)}
.thread:active{transform:scale(.985)}
.thread h3{font-family:var(--display);font-size:22px;line-height:1.05;text-transform:uppercase;font-weight:700}
.thread p{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thread .foot2{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.thread .foot2 span{display:inline-flex;gap:5px;align-items:center}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.fab{position:absolute;right:16px;bottom:88px;z-index:20;min-height:52px;padding:0 20px;border-radius:var(--pill);background:var(--silver);color:var(--on-silver);font-weight:700;display:none;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:transform .18s var(--ease)}
.fab.on{display:inline-flex}
.fab:active{transform:scale(.96)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--silver-2);font-weight:600;margin-top:10px}
.reply{padding:12px 14px}
.reply p{margin-top:6px;font-size:15px}
.like{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--pill);color:var(--muted);font-size:14px;font-weight:600}
.like.on{color:var(--silver)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty i{font-size:34px;color:var(--silver-2);display:block;margin-bottom:8px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:40}
.scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s var(--ease);max-height:90%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-size:26px;text-transform:uppercase;font-weight:800;margin-bottom:10px}
label{display:block;font-size:14px;font-weight:600;color:var(--silver-2);margin:12px 0 6px}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line)}
textarea.field{min-height:110px;resize:vertical}
.field::placeholder{color:#7d8591}
.sheet .btn.full{width:100%;margin-top:16px}
.help{font-size:13px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:rgba(10,11,13,.94);backdrop-filter:blur(18px);padding:6px 4px max(8px,env(safe-area-inset-bottom));position:relative;z-index:30}
.tab{min-height:56px;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:12px;transition:color .2s,transform .18s var(--ease)}
.tab i{font-size:23px}
.tab:active{transform:scale(.94)}
.tab[aria-selected="true"]{color:var(--silver)}
.tab .bar{width:22px;height:3px;border-radius:3px;background:transparent;transition:background .2s}
.tab[aria-selected="true"] .bar{background:var(--silver)}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--silver);color:var(--on-silver);font-weight:700;padding:11px 18px;border-radius:var(--pill);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:60;font-size:15px;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* wrappers */
.split,.cwrap,.fwrap,.mwrap,.homegrid{display:block}
.fdetail{display:none}
body.thread-open .flist{display:none}
body.thread-open .fdetail{display:block}
body.thread-open .fab{display:none!important}
.sel-thread{border-color:var(--silver-2)}

@media (min-width:700px) and (max-width:999px){
  .view{padding:0 32px 32px}
  .top{padding-left:32px;padding-right:32px}
  .banner{margin-left:32px;margin-right:32px}
}

(function(){
  var el=document.getElementById('intro'),seen=null;

function scoresHTML(){
  const key=S.sview==='gross'?'gross':'net',all=scOrder(key);
  const pos=new Map(all.map((r,i)=>[r.id,i+1]));
  const rows=all.filter(r=>S.chapter==='All'||r.chapter===S.chapter);
  const lowNet=scOrder('net')[0],lowGross=scOrder('gross')[0];
  const most=ROUNDS.slice().sort((a,b)=>(b.birdies+b.eagles*2)-(a.birdies+a.eagles*2)||a.gross-b.gross)[0];
  const avg=(ROUNDS.reduce((a,r)=>a+r.gross,0)/ROUNDS.length).toFixed(1);
  const chs=['SoCal','NorCal','Nevada','National'].map(c=>{const rs=ROUNDS.filter(r=>r.chapter===c),best=rs.map(r=>r.net).sort((a,b)=>a-b).slice(0,4);
    return {c,n:rs.length,best4:best.reduce((a,b)=>a+b,0),avg:(rs.reduce((a,r)=>a+r.net,0)/rs.length).toFixed(1)}}).sort((a,b)=>a.best4-b.best4);
  const mine=S.demo?ROUNDS.find(r=>r.name===S.name):null;

async function loadSchedule(){
  if(LIVE.sched)return;LIVE.sched=1;
  try{
    const d=await getJSON(ESPN+'teams/lv/schedule');
    (d.events||[]).forEach(e=>{
      const g=GAMES.find(x=>x.wk===(e.week&&e.week.number));if(!g)return;
      const c=e.competitions[0],st=c.status.type;
      const us=c.competitors.find(t=>t.team.abbreviation==='LV'),them=c.competitors.find(t=>t.team.abbreviation!=='LV');
      if(!us||!them)return;
      g.eid=e.id;
      const sc=t=>t.score==null?'':(t.score.displayValue!=null?t.score.displayValue:t.score);
      const b=(c.broadcasts||[])[0];if(b&&b.media&&b.media.shortName)g.tv=b.media.shortName.toUpperCase();
      if(st.completed){g.res=(us.winner?'W ':them.winner?'L ':'T ')+sc(us)+'-'+sc(them);g.live=null}
      else if(st.state==='in'){g.live=sc(us)+'-'+sc(them)+' '+st.shortDetail}
      else if(c.timeValid!==false&&e.timeValid!==false){g.date=laDate(e.date);g.kick=laTime(e.date);g.tbd=false}
    });
    LIVE.record=d.team&&d.team.recordSummary;LIVE.stamp=new Date();
    GAMES.filter(g=>!g.res&&g.eid).forEach(loadPred);
    loadSummary(nextGame());

    const s=side&&(p[side].statistics||[]).find(x=>x.name==='gameProjection');
    if(s){const v=parseFloat(s.value!=null?s.value:s.displayValue);if(!isNaN(v))LIVE.pred[g.eid]=v}

function goTour(i){
  S.tour=Math.max(0,Math.min(TOUR.length-1,i));TOUR[S.tour].setup();renderMembers();

function renderCoach(){
  const c=$('#coach');if(!c)return;
  document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));

  const s=TOUR[S.tour],last=S.tour===TOUR.length-1;
  c.innerHTML=`<div class="st">Demo tour - step ${S.tour+1} of ${TOUR.length}</div><h4>${s.t}</h4><p>${s.x}</p>

  const t=e.target.closest('[data-tour]');if(t){const a=t.dataset.tour;

function tixRuleOK(x){
  const t=S.cfg.tix;
  if(x.mode==='trade'&&!t.trades){toast('Trades are turned off by the club.');return false}
  if(!x.game&&!t.clubSpots){toast('Club event spots can\'t be listed right now.');return false}
  if(x.mode==='sell'&&x.face){const max=t.cap==='face'?x.face:t.cap==='pct'?Math.floor(x.face*(1+(+t.pct||0)/100)):Infinity;
    if(x.price>max){toast('Club limit is $'+max+' each for these seats.');return false}}
  if(t.approve&&!can('tix'))x.pending=true;
  return true;
}

const chName=c=>{const p=PLANS.find(x=>x.chapter===c);return p?(p.chapter==='National'?'National':p.name+' chapter'):c};
const firstName=()=>(S.name||'Member').split(/\s+/)[0];
const invChapter=()=>S.invCh||S.cfg.my.chapter||'SoCal';
const invCode=()=>{const b=(S.name||'member').replace(/[^a-z]/gi,'').slice(0,6).toLowerCase()||'member';return b+'-'+scHash((S.name||'')+'|'+invChapter()).toString(36).slice(0,4)};
const invLink=()=>location.origin+location.pathname+'?invite='+invCode()+'&by='+encodeURIComponent(S.name||'A member')+'&ch='+encodeURIComponent(invChapter());
const invMsg=()=>'Hey, come golf with us. Raider Nation Golf Club: golf, travel and Raiders football. Here is my invite: '+invLink();
const canInvite=()=>S.member&&S.cfg.club.invites&&(S.cfg.club.invWho==='all'||S.role!=='member');
function syncTop(){const b=document.querySelector('.topjoin');if(!b)return;
  if(S.member&&canInvite()){b.dataset.sub='home|invite';b.innerHTML='<i class="ph-bold ph-paper-plane-tilt"></i> Invite a friend'}
  else{b.dataset.sub='home|join';b.innerHTML='<i class="ph-bold ph-identification-badge"></i> Join the club'}}
function viewBar(){return `<div class="viewbar"><span><i class="ph-bold ph-eye"></i> Viewing as</span><div class="seg2"><button class="chip" data-asview="guest" aria-pressed="${!S.member}">Guest</button><button class="chip" data-asview="member" aria-pressed="${S.member}">Member</button></div><small>Preview switch. In the live app this follows sign-in.</small></div>`}
const PERKS=[['map-trifold','Member map','See members near you and who is going to each game'],['ticket','Ticket exchange','Buy, sell and trade seats for every Raiders game'],['chats-circle','Forum posting','Start threads and reply. Guests can only read'],['golf','Scorecards and handicap','Club leaderboard, chapter cup, GHIN for chapters'],['paper-plane-tilt','Your own invite link','Bring friends into your chapter']];
const perksHTML=()=>`<ul class="perks">${PERKS.map(([i,t,d])=>`<li><i class="ph-bold ph-${i}"></i><span><b>${t}</b><small>${d}</small></span></li>`).join('')}</ul>`;
function guestCard(){return `<div class="card guestcard"><h3>What members get</h3>${perksHTML()}
  <div class="acts" style="margin-top:14px"><button class="btn" data-sub="home|join"><i class="ph-bold ph-identification-badge"></i> Join from $99 a year</button><button class="btn ghost" data-signin><i class="ph-bold ph-sign-in"></i> Member sign in</button></div></div>`}
function inviteCard(){if(!canInvite())return '';const n=(S.invLog||{}).shared||0;
  return `<div class="card invcard"><h3>Invite a friend</h3><p class="meta">Your link opens a welcome page with your name and the ${esc(chName(invChapter()))}.${n?` Shared ${n} time${n===1?'':'s'}.`:''}</p>
  <div class="invlink"><input class="field" readonly value="${esc(invLink())}" aria-label="Your invite link" data-invsel><button class="btn small" data-inv="copy"><i class="ph-bold ph-copy"></i> Copy</button></div>
  <div class="acts" style="margin-top:10px"><button class="btn small ghost" data-inv="share"><i class="ph-bold ph-share-network"></i> Share</button><button class="btn small ghost" data-sub="home|invite">More options</button></div></div>`}
function inviteHTML(){
  if(!S.member)return pageHead('Invite a friend')+`<div class="card gate rise"><i class="ph-fill ph-paper-plane-tilt"></i><h3>Invite links are for members</h3><p>Every member gets their own link to bring friends into their chapter. Got a link from a member? Open it and you land on their invite.</p><div class="acts"><button class="btn" data-sub="home|join"><i class="ph-bold ph-identification-badge"></i> Join the club</button><button class="btn ghost" data-signin><i class="ph-bold ph-sign-in"></i> Sign in</button></div></div>`;
  if(!canInvite())return pageHead('Invite a friend')+`<div class="card gate rise"><i class="ph-fill ph-lock-key"></i><h3>Invites are off</h3><p>${S.cfg.club.invites?'Club leaders hand out invite links right now.':'Club leaders turned invite links off for now.'} Ask your chapter president to bring someone in.</p><div class="acts"><button class="btn ghost" data-sub="home|leaders">Club leaders</button></div></div>`;
  const L=S.invLog||{},ex=S.cfg.club.invExpire;
  return pageHead('Invite a friend','Send your link. Your friend lands on a welcome page with your name and chapter, then picks a plan.')+`<div class="invcols rise">
   <div class="card"><h3>Your invite link</h3>
    <label for="invCh">Invite them to</label><select class="field" id="invCh">${PLANS.map(p=>`<option value="${p.chapter}" ${invChapter()===p.chapter?'selected':''}>${esc(chName(p.chapter))} - $${p.price} a year</option>`).join('')}</select>
    <div class="invlink"><input class="field" readonly value="${esc(invLink())}" aria-label="Your invite link" data-invsel><button class="btn small" data-inv="copy"><i class="ph-bold ph-copy"></i> Copy</button></div>
    <div class="invacts"><button class="btn ghost" data-inv="share"><i class="ph-bold ph-share-network"></i> Share</button><a class="btn ghost" data-inv="text" href="sms:?&body=${encodeURIComponent(invMsg())}"><i class="ph-bold ph-chat-text"></i> Text</a><a class="btn ghost" data-inv="email" href="mailto:?subject=${encodeURIComponent('Join me in Raider Nation Golf Club')}&body=${encodeURIComponent(invMsg())}"><i class="ph-bold ph-envelope-simple"></i> Email</a><button class="btn ghost" data-inv="preview"><i class="ph-bold ph-eye"></i> See what they see</button></div>
    <p class="help">${ex==='never'?'Your link does not expire.':'Links work for '+ex+' days, then you get a fresh one.'}${S.cfg.club.invApprove?' The chapter president approves new members first.':''}</p>
    <div class="invstats"><div><b>${L.shared||0}</b><small>Shared</small></div><div><b>-</b><small>Opened</small></div><div><b>-</b><small>Joined</small></div></div>
    <p class="help">Opened and joined counts start when the live app tracks invites.</p>
   </div>
   <div class="card"><h3>What your friend sees</h3>
    <div class="invprev"><img src="assets/logo/rngc-ball-static.svg" alt=""><b>${esc(S.name||'A member')} wants you in</b><p>${esc(chName(invChapter()))} - golf, travel and Raiders football</p></div>
    ${perksHTML()}
    <p class="help">Guests can browse events, the schedule and courses. Everything above unlocks when they join.</p>
   </div></div>`;
}
function invCopy(){const t=invLink(),done=()=>{S.invLog=S.invLog||{};S.invLog.shared=(S.invLog.shared||0)+1;save();toast('Invite link copied');refreshInvite()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>{fallbackCopy(t);done()});else{fallbackCopy(t);done()}}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
document.addEventListener('click',e=>{
  const sel=e.target.closest('[data-invsel]');if(sel){sel.select();return}
  const av=e.target.closest('[data-asview]');if(av){
    if(av.dataset.asview==='member'){S.member=true;S.demo=true;if(!S.name)S.name='Demo Member';toast('Member view: demo member')}
    else{S.member=false;S.demo=false;S.tour=-1;toast('Guest view')}
    save();renderAll();renderSubnav();return}
  const b=e.target.closest('[data-inv]');if(!b)return;const k=b.dataset.inv;
  if(k==='copy'){invCopy();return}
  if(k==='share'){if(navigator.share){navigator.share({title:'Raider Nation Golf Club',text:'Hey, come golf with us. Raider Nation Golf Club: golf, travel and Raiders football.',url:invLink()}).then(()=>{S.invLog=S.invLog||{};S.invLog.shared=(S.invLog.shared||0)+1;save();refreshInvite()}).catch(()=>{})}else invCopy();return}
  if(k==='text'||k==='email'){S.invLog=S.invLog||{};S.invLog.shared=(S.invLog.shared||0)+1;save();setTimeout(refreshInvite,50);return}
  if(k==='preview'){openInvite({code:invCode(),by:S.name||'A member',ch:invChapter(),preview:true});return}
});
function refreshInvite(){if(S.tab==='home'&&['invite','overview'].includes(S.hpage||'overview'))renderHome()}
document.addEventListener('change',e=>{if(e.target.id==='invCh'){S.invCh=e.target.value;renderHome()}});

/* someone opens an invite link: welcome page with who invited them */
const IV=$('#inviteIn');
function openInvite(inv){
  const p=PLANS.find(x=>x.chapter===inv.ch)||PLANS[1];
  $('#inviteBox').innerHTML=`<img class="si-mark" src="assets/logo/rngc-ball-static.svg" alt="">
   <h2 id="invTitle">You're invited<em>${esc(inv.by)} wants you in</em></h2>
   <p class="si-sub">Raider Nation Golf Club. Golf, travel and Raiders football, ${esc(chName(p.chapter))}.</p>
   ${perksHTML()}
   <p class="si-plan">${esc(p.name)} plan: $${p.price} a year. ${esc(p.blurb)}</p>
   <button class="btn si-full" type="button" id="ivJoin" style="margin-top:14px"><i class="ph-bold ph-identification-badge"></i> Join the ${esc(chName(p.chapter))}</button>
   <button class="btn ghost si-full" type="button" id="ivLook" style="margin-top:10px"><i class="ph-bold ph-compass"></i> Look around first</button>
   <div class="si-links"><button type="button" id="ivSignin">${S.member?'Back to the app':"I'm a member, sign in"}</button></div>
   ${inv.preview?'<p class="si-msg">Preview: this is the page your friend sees.</p>':''}`;
  IV.hidden=false;requestAnimationFrame(()=>IV.classList.add('on'));
  const close=()=>{IV.classList.remove('on');setTimeout(()=>{IV.hidden=true},360)};
  $('#ivJoin').addEventListener('click',()=>{if(!inv.preview){S.invite=inv;try{sessionStorage.setItem('rngcInvite',JSON.stringify(inv))}catch(e){}}close();S.joinCh=p.chapter;S.joinSent=null;S.hpage='join';setTab('home');if(inv.preview)toast('Preview: your friend lands on the join form')});
  $('#ivLook').addEventListener('click',()=>{if(!inv.preview){S.invite=inv;try{sessionStorage.setItem('rngcInvite',JSON.stringify(inv));sessionStorage.setItem('rngcGuest','1')}catch(e){}}close()});
  $('#ivSignin').addEventListener('click',()=>{close();if(!S.member)setTimeout(openSignIn,330)});
}

function renderAll(){renderHome();renderEvents();renderForum();if(S.tab==='courses')renderCourses();if(S.tab==='games')renderGames();if(S.tab==='members')renderMembers();if(S.tab==='settings')renderSettings()}
renderChips();renderAll();setTab('home');loadSchedule();

/* header logo: tap it to replay the animation; it also replays on its own every few clicks (6+ clicks and 60+ seconds apart) */
(function(){
  const lg=document.getElementById('hdrLogo');if(!lg)return;
  const STATIC=lg.getAttribute('src'),ANIM='assets/logo/rngc-ball-animated.svg',LEN=7600;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy=false,last=Date.now(),clicks=0,svg=null,url=null;
  fetch(ANIM).then(r=>r.ok?r.text():null).then(t=>{svg=t}).catch(()=>{});
  function play(){
    if(busy||reduce)return;busy=true;last=Date.now();clicks=0;
    if(url)URL.revokeObjectURL(url);
    url=svg?URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})):null;
    lg.src=url||ANIM+'?r='+Date.now();
    setTimeout(()=>{lg.src=STATIC;busy=false},LEN);
  }
  window.playLogo=play;
  /* off the home screen the logo takes you home; on the home screen it replays the animation */
  function tap(){if(S.tab!=='home'||(S.hpage||'overview')!=='overview'){closeSheet();S.openThread=null;S.hpage='overview';setTab('home');return}play()}
  lg.addEventListener('click',tap);
  lg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
  document.addEventListener('click',e=>{
    if(e.target.closest('#hdrLogo')||!e.target.closest('button,a,select'))return;
    if(++clicks>=6&&Date.now()-last>60000)play();
  });
})();

/* ---------- sign-in screen (preview: real sign-in connects to club accounts later) ---------- */
const SI=$('#signin');
function openSignIn(){SI.hidden=false;$('#siMsg').textContent='';requestAnimationFrame(()=>SI.classList.add('on'))}
function closeSignIn(){SI.classList.remove('on');setTimeout(()=>{SI.hidden=true},360)}
$('#siForm').addEventListener('submit',e=>{e.preventDefault();
  $('#siMsg').textContent='Preview only: sign-in connects to your club account in the live app. Tap Try demo mode to look around as a member.'});
$('#siDemo').addEventListener('click',()=>{S.member=true;S.demo=true;if(!S.name)S.name='Demo Member';save();closeSignIn();renderAll();toast('Signed in to demo mode')});
$('#siGuest').addEventListener('click',()=>{try{sessionStorage.setItem('rngcGuest','1')}catch(e){}closeSignIn()});
(function(){
  let g=null,inv=null;try{g=sessionStorage.getItem('rngcGuest');inv=JSON.parse(sessionStorage.getItem('rngcInvite')||'null')}catch(e){}
  const q=new URLSearchParams(location.search);
  if(q.get('invite')){const ch=PLANS.some(p=>p.chapter===q.get('ch'))?q.get('ch'):'National';
    const fresh={code:q.get('invite').slice(0,24),by:(q.get('by')||'A member').slice(0,30),ch};
    if(S.cfg.club.invites){openInvite(fresh);return}}
  if(inv)S.invite=inv;
  if(!S.member&&!g)openSignIn()})();
syncTop();
</script>
