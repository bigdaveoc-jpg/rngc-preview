<style>
:root{
  --bg:#0a0b0d; --bg-2:#111317; --panel:#16191e; --panel-2:#1d2127;
  --line:#2a2f37; --text:#eef0f3; --muted:#9aa2ae; --silver:#d5dae1; --silver-2:#aeb5bf;
  --on-silver:#0a0b0d;
  --r:14px; --r-sm:10px; --pill:999px;
  --display:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050506;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:var(--text)}
select option{background:#16191e;color:#eef0f3}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}

.stage{min-height:100dvh}
.app{position:relative;width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* top bar */
.top{padding:max(14px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#0f1114,var(--bg))}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:46px;flex:none}
.top .logo{width:58px;height:67px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s var(--ease)}
.top .logo:active{transform:scale(.94)}
.brandtxt{flex:1;line-height:1}
.brandtxt b{display:block;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.brandtxt b em{font-style:normal;color:var(--silver-2);font-weight:700;letter-spacing:.22em;font-size:13px;display:block;margin-top:3px}
.brandtxt span{display:none}
.iconbtn{width:44px;height:44px;border-radius:var(--pill);display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:20px;transition:transform .18s var(--ease)}
.iconbtn:active{transform:scale(.94)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;font-weight:600;transition:transform .18s var(--ease),background .2s,color .2s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--silver);color:var(--on-silver);border-color:var(--silver)}
.topjoin{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.selwrap{position:relative;width:100%}
.chsel{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:0 44px 0 16px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:15px;cursor:pointer}
.chsel:hover{border-color:var(--silver-2)}
.selwrap i{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--silver-2)}

/* views */
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 28px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .28s var(--ease),transform .28s var(--ease),visibility 0s .28s;overscroll-behavior:contain}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s var(--ease),transform .28s var(--ease)}
h2.sec{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:26px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:-4px 0 12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:10px}
.rise > *{animation:rise .5s var(--ease) both}
.rise > *:nth-child(2){animation-delay:.05s}.rise > *:nth-child(3){animation-delay:.1s}.rise > *:nth-child(4){animation-delay:.15s}.rise > *:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{min-height:48px;padding:0 20px;border-radius:var(--pill);background:var(--silver);color:var(--on-silver);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),filter .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost.on{background:var(--panel-2);border-color:var(--silver-2);color:var(--silver)}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--pill);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--silver-2)}
.meta{font-size:13px;color:var(--muted);margin-top:4px}

/* home hero */
.hero{margin-top:16px;border-radius:22px;position:relative;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;
  background:#14171b}
/* group photo sits on top, framed on the people at the bottom of the shot; words sit below it */
.hero .bg{position:relative;height:230px;background-size:auto 175%;background-repeat:no-repeat;background-position:center 96%;filter:grayscale(.55) contrast(1.05)}
@media (min-width:600px){.hero .bg{height:320px;background-size:cover;background-position:center 92%}}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,13,0) 55%,#14171b 100%)}
.hero::after{content:none}
.hero .in{position:relative;z-index:2;padding:6px 18px 20px;width:100%}
.hero .tag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.hero h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.96;letter-spacing:.01em;text-transform:uppercase;margin:8px 0 8px}
.hero p{color:#c3c9d2;font-size:16px;max-width:46ch}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.next{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px}
.next .cd{font-family:var(--display);font-weight:800;font-size:46px;line-height:.9;text-align:center}
.next .cd small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.next h3{font-family:var(--display);text-transform:uppercase;font-size:22px;line-height:1.05;font-weight:700}

/* about + interviews */
.vidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card.vid{display:flex;flex-direction:column;gap:10px;padding:10px;text-decoration:none;color:inherit}
.card.vid b{font-size:15px;line-height:1.35;font-weight:600}
.vthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#111;max-width:100%}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb i{position:absolute;inset:0;margin:auto;width:52px;height:52px;font-size:52px;color:#fff;opacity:.9}
/* membership */
.plans{display:grid;gap:10px}
.plan{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px}
.plan h3{font-family:var(--display);font-size:24px;text-transform:uppercase;font-weight:700;line-height:1}
.plan .price{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.plan .price small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.plan p{color:var(--muted);font-size:14px;margin-top:6px}
.leaders{display:grid;gap:10px}
.lead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 14px}
.lead img{width:64px;height:64px;object-fit:contain}
.lead b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.05}
.lead span{font-size:14px;color:var(--muted)}
.perks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* news */
.news{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:12px;transition:transform .18s var(--ease)}
.news:active{transform:scale(.985)}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;object-position:top;background:var(--panel-2)}
.news h3{font-family:var(--display);font-size:21px;line-height:1.05;font-weight:700;letter-spacing:.01em;text-transform:uppercase}

/* sponsors / shop */
.spons{display:flex;flex-wrap:wrap;gap:10px}
.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.foot a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--silver)}

/* events */
.month{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silver-2);margin:22px 0 8px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:14px}
.ev.past{opacity:.72}
.date{width:58px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);text-align:center;padding:8px 0;align-self:start}
.date b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.date span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ev h3{font-family:var(--display);font-size:23px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.ev .where{font-size:14px;color:var(--muted);margin:4px 0 8px}
.ev .note{font-size:14px;color:#c3c9d2;margin-bottom:10px}
.ev .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .row .grow{flex:1;color:var(--muted);font-size:14px}
.flyers{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.flyers img{flex:none;height:260px;width:auto;border-radius:12px;border:1px solid var(--line);scroll-snap-align:start;background:var(--panel)}

/* map + courses */
.mapbox{height:250px;border-radius:var(--r);border:1px solid var(--line);margin-top:16px;background:var(--bg-2);overflow:hidden}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--silver);border:2px solid #0a0b0d;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.pin i{transform:rotate(45deg);color:#0a0b0d;font-size:14px}
.pin.sel{background:#fff;transform:rotate(-45deg) scale(1.25)}
.pin.me{background:#0a0b0d;border-color:var(--silver)}
.pin.me i{color:var(--silver)}
.pin.trip{background:#fff}
.course{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;transition:transform .18s var(--ease),border-color .2s}
.course:active{transform:scale(.985)}
.course.sel{border-color:var(--silver-2)}
.course .n{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:22px;color:var(--silver)}
.course b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;display:block}
.course small{color:var(--muted);font-size:13px}
.connp{margin-top:12px}
.conntop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conn{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:var(--panel)}
.conn b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.conn small{font-size:12px;color:var(--muted)}
.conn[aria-pressed="true"]{border-color:var(--silver);background:var(--panel-2)}
.conn.on b{color:#7fd39a}.conn.link b{color:#e6c35c}
.connl{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.connl.on{color:#7fd39a}.connl.link{color:#e6c35c}
.cmapsm{height:210px;margin:4px 0 2px}
.clbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 2px 8px}
.course .ctag{display:inline-block;margin:6px 6px 0 0;font-style:normal;font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:var(--pill);background:var(--silver);color:var(--on-silver)}
.course .ctag.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
a.card.course{color:inherit;text-decoration:none}
.cback{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--silver);font-weight:700;font-size:15px;margin:2px 0 4px}
.cfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.cfacts div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.cfacts b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.cfacts span{font-size:12px;color:var(--muted)}
.cacts{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0}
.ctable{padding:4px 12px}
.ctee{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ctee th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 2px}
.ctee td{padding:10px 2px;border-top:1px solid var(--line)}
.ctee th:not(:first-child),.ctee td:not(:first-child){text-align:right}
.cev{display:grid;gap:10px}
.cevr{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}
.cevr img{width:44px;height:55px;object-fit:cover;border-radius:6px;flex:none;border:1px solid var(--line)}
.cevr b{display:block;font-size:16px}.cevr span{font-size:13px;color:var(--muted)}
.cevr.past b{font-weight:600}
.findsrc{font-size:12px;color:var(--muted);margin:14px 2px 24px}
.detail{margin-top:12px;display:none}
.detail.on{display:block;animation:rise .35s var(--ease) both}
.detail h3{font-family:var(--display);font-size:26px;text-transform:uppercase;font-weight:800}
.detail p{color:var(--muted);font-size:15px;margin:4px 0 12px}
.detail .acts{display:flex;gap:10px;flex-wrap:wrap}

/* members */
.gate{margin-top:18px;text-align:center;padding:30px 20px}
.gate i{font-size:40px;color:var(--silver)}
.gate h3{font-family:var(--display);font-size:30px;text-transform:uppercase;margin:8px 0}
.gate p{color:var(--muted);max-width:46ch;margin:0 auto 16px}
.gate .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.msgrow{display:block;width:100%;text-align:left;padding:12px 14px}
.msgrow b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;display:block}
.msgrow small{color:var(--muted);font-size:13px;display:block}
.msgrow p{margin:4px 0 0;color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.msgrow.unread{border-color:var(--silver)}
.msgrow.unread b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--silver);margin-right:8px;vertical-align:middle}
.msgbody{white-space:pre-wrap;line-height:1.5;margin:12px 0}
.pickbox{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;margin-top:6px}
.pickbox label{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin:3px 5px 0 0;border:1px solid var(--silver-2);color:var(--silver);background:var(--panel-2)}

.thread p{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thread .foot2{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.thread .foot2 span{display:inline-flex;gap:5px;align-items:center}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.fab{position:absolute;right:16px;bottom:88px;z-index:20;min-height:52px;padding:0 20px;border-radius:var(--pill);background:var(--silver);color:var(--on-silver);font-weight:700;display:none;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:transform .18s var(--ease)}
.fab.on{display:inline-flex}
.fab:active{transform:scale(.96)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--silver-2);font-weight:600;margin-top:10px}
.reply{padding:12px 14px}
.reply p{margin-top:6px;font-size:15px}
.like{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--pill);color:var(--muted);font-size:14px;font-weight:600}
.like.on{color:var(--silver)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty i{font-size:34px;color:var(--silver-2);display:block;margin-bottom:8px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:40}
.scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s var(--ease);max-height:90%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-size:26px;text-transform:uppercase;font-weight:800;margin-bottom:10px}
label{display:block;font-size:14px;font-weight:600;color:var(--silver-2);margin:12px 0 6px}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line)}
textarea.field{min-height:110px;resize:vertical}
.field::placeholder{color:#7d8591}
.sheet .btn.full{width:100%;margin-top:16px}
.help{font-size:13px;color:var(--muted);margin-top:6px}
/* club setup checklist */
.csnudge{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--silver-2);margin:0 0 12px}
.csnudge .meta{margin-top:4px}
.csbar{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin:6px 0 16px}
.csbar i{display:block;height:100%;background:var(--silver)}
.cscard .cshead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.cscard .cshead .meta{margin-top:2px}
.csnum{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--silver);color:var(--on-silver);font-weight:800;font-size:16px}
.cscard.done .csnum{background:#1f7a3f;color:#fff}
.cscard label.csl{display:block;font-weight:600;margin:4px 0 6px}
.cspick{border:0;padding:0;margin:2px 0;min-width:0}
.cspick legend{font-weight:600;margin-bottom:8px;padding:0}
.cspick .row{display:flex;flex-wrap:wrap;gap:8px}
.cschip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-weight:600}
.cschip input{width:20px;height:20px;margin:0;accent-color:var(--silver)}
.cschip:has(input:checked){border-color:var(--silver);background:var(--panel-2)}
.cssteps{margin:0 0 12px;padding-left:22px;display:grid;gap:12px}
.cssteps li{line-height:1.45}
.cssteps .btn{margin-top:6px}
.cssend{margin-top:14px;width:100%}
.adminstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid #e8ecf1;background:var(--panel-2);font-size:13px;font-weight:700}
.adminstrip button{font:inherit;font-weight:600;color:var(--silver-2);background:none;border:0;text-decoration:underline;min-height:36px;padding:0 4px;cursor:pointer}
details.fold{border:1px solid var(--line);margin-top:8px}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
details.fold .fb{padding:4px 14px 12px}
.duesbad{color:#ff8a80}.dueswarn{color:#ffd180}.duesok{color:#9be3a8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:rgba(10,11,13,.94);backdrop-filter:blur(18px);padding:6px 4px max(8px,env(safe-area-inset-bottom));position:relative;z-index:30}
.tab{min-height:56px;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:12px;transition:color .2s,transform .18s var(--ease)}
.tab i{font-size:23px}
.tab:active{transform:scale(.94)}
.tab[aria-selected="true"]{color:var(--silver)}
.tab .bar{width:22px;height:3px;border-radius:3px;background:transparent;transition:background .2s}
.tab[aria-selected="true"] .bar{background:var(--silver)}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--silver);color:var(--on-silver);font-weight:700;padding:11px 18px;border-radius:var(--pill);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:60;font-size:15px;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* wrappers */
.split,.fwrap{display:block}
.fdetail{display:none}
body.thread-open .flist{display:none}
body.thread-open .fdetail{display:block}
body.thread-open .fab{display:none!important}
.sel-thread{border-color:var(--silver-2)}

<script>
/* the animated logo, downloaded once and shared by the intro and the header logo */
var rngcLogoP=null;function rngcLogo(){return rngcLogoP||(rngcLogoP=fetch('assets/logo/rngc-ball-animated.svg').then(function(r){return r.ok?r.text():null}).catch(function(){return null}))}
(function(){
  var el=document.getElementById('intro'),img=el.querySelector('img'),seen=null;
  /* in the browser: once a day, not every time the app opens on the course.
     opened from the home-screen icon: every fresh launch (coming back from the background doesn't replay it).
     Android shares the browser's storage, so the once-a-day rule hid it on the icon's first launch (Nov 12 fix). */
  var app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var day=new Date().toDateString();
  try{seen=app?sessionStorage.getItem('rngcIntroRun')==='1':localStorage.getItem('rngcIntroDay')===day}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return}
  try{if(app)sessionStorage.setItem('rngcIntroRun','1');else localStorage.setItem('rngcIntroDay',day)}catch(e){}
  var done=function(){if(!el.isConnected)return;el.classList.add('out');setTimeout(function(){el.remove()},600)};
  /* The animation must start from frame one while the screen is showing. Phones keep one clock per logo file, so a
     logo the phone already loaded (earlier visit, or behind the launch splash of the home-screen app) can show up
     already finished. So: download the logo, wait until the page is on screen, then show it from a brand-new copy
     (same trick as the header logo replay). The 7 s clock starts when it shows. */
  var started=false,start=function(){if(started)return;started=true;setTimeout(done,7000)};   /* the logo's story ends at 5.2 s; 7 s lets it finish and settle on a slow phone (David, Nov 13: it was cut off) */
  /* Wait until the app has finished building the page (it's heavy on a phone): while the phone is busy the logo's
     animation skips ahead, so it looked cut off (David, Nov 13). The dark intro screen covers the page meanwhile. */
  var svg,got=false,ready=false;
  var put=function(){if(!got||!ready||started||!el.isConnected)return;
    var go=function(){if(document.visibilityState!=='visible')return;document.removeEventListener('visibilitychange',go);
      setTimeout(function(){
        img.onload=start;img.onerror=done;
        img.src=svg?URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})):'assets/logo/rngc-ball-animated.svg?r='+Date.now()},60)};
    document.addEventListener('visibilitychange',go);go()};
  rngcLogo().then(function(t){svg=t;got=true;put()});
  var onReady=function(){setTimeout(function(){ready=true;put();
    var skip=function(){if(document.visibilityState!=='visible')return;document.removeEventListener('visibilitychange',skip);
      setTimeout(function(){if(!started)done()},4000)};   /* no logo 4 s after the page is ready and showing: skip */
    document.addEventListener('visibilitychange',skip);skip()},350)};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onReady);else onReady();
  el.addEventListener('click',done);
})();
</script>

const scHash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
function scRng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const scGauss=r=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const ROUNDS=[...MEMBERS.map(m=>({id:m.id,name:m.name,chapter:m.chapter})),...SC_EXTRA].map((p,i)=>{
  const hcp=SC_HCP[i],r=scRng(scHash(p.id+'-fall26'));
  const holes=SC_EVENT.par.map((par,h)=>{
    const rec=Math.floor(hcp/18)+(SC_EVENT.si[h]<=hcp%18?1:0);
    let k=Math.round(rec+.17+scGauss(r)*.8);
    k=Math.max(par===5?-2:-1,Math.min(2+rec,k));if(k===-2&&r()>.35)k=-1;
    return par+k});
  const diff=h=>holes[h]-SC_EVENT.par[h],cnt=f=>holes.filter((s,h)=>f(diff(h))).length;

document.addEventListener('change',e=>{if(e.target.name==='jc'){S.joinCh=e.target.value}});
document.addEventListener('submit',e=>{
  if(e.target.id==='joinForm'){e.preventDefault();
    const v=id=>($('#'+id).value||'').trim(),msg=$('#joinMsg');
    const ch=(document.querySelector('input[name=jc]:checked')||{}).value;
    if(!v('jf')||!v('jl')||!v('jcity')){msg.textContent='Add your name and city.';return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('je'))){msg.textContent='Check the email address.';return}
    if(!ch){msg.textContent='Pick a chapter.';return}
    const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;msg.textContent='Sending...';
    fetch(AUTH+'/club/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({first:v('jf'),last:v('jl'),email:v('je'),phone:v('jp'),city:v('jcity'),hcp:v('jh'),heard:v('jhear'),note:v('jm'),chapter:ch,by:S.invite?S.invite.by:'',website:v('jweb')})})
     .then(r=>r.json().then(d=>({ok:r.ok,d})))
     .then(({ok,d})=>{if(!ok||!d.ok)throw new Error(d.error||'');
       S.joinSent={first:v('jf'),chapter:ch,at:Date.now(),by:S.invite?S.invite.by:''};S.joinCh=ch;save();renderHome();$('#v-home').scrollTop=0;toast('Sent to '+LEAD_X[PRES[ch]].name)})
     .catch(err=>{btn.disabled=false;msg.textContent=err.message||'That did not go through. Check your connection and try again.'})}
  if(e.target.id==='leadMsgForm'){e.preventDefault();const L=LEAD_X[e.target.dataset.lead];if(!$('#lmText').value.trim())return;closeSheet();toast('Message sent to '+L.first+'. Preview only, nothing sent yet.')}
  if(e.target.id==='sponForm'){e.preventDefault();if(!$('#spName').value.trim()||!$('#spEmail').value.trim()){toast('Add a business name and email');return}closeSheet();toast('Sent to Ross. Preview only, nothing sent yet.')}
});

const cSort=a=>a.slice().sort((x,y)=>{const nx=cNext(x.id),ny=cNext(y.id);return(!!ny-!!nx)||(nx&&ny?(nx.date<ny.date?-1:1):0)||(cCount(y.id)-cCount(x.id))});

document.addEventListener('click',async e=>{

  if(e.target.closest('[data-connadd]')){openAddMember();return}
  const ja=e.target.closest('[data-joinadd]');if(ja){const m=(MSG.items||[]).find(x=>x.id===ja.dataset.joinadd);if(!m||!m.join)return;closeSheet();
    if(!DIR.items)await loadDir();setTimeout(()=>openAddMember(m.join),330);return}
  const jo=e.target.closest('[data-joinopen]');if(jo){closeSheet();if(!DIR.items)await loadDir();setTimeout(()=>openDirMember(jo.dataset.joinopen),330);return}
  const ml=e.target.closest('[data-connmail]');if(!ml)return;
  const ids=ml.dataset.connmail.split(',').filter(Boolean);
  if(!confirm('Email a personal setup link to the '+ids.length+' member'+(ids.length===1?'':'s')+' not on the app yet? Each email has that person\'s own link. A link sent to them before stops working, the new one is the one to use.'))return;
  ml.disabled=true;
  try{const r=await authCall('/admin/mail-links',{ids},authTok());toast('Emailed '+r.sent+' link'+(r.sent===1?'':'s')+(r.held?', '+r.held+' held':''));Object.keys(SETLINK).forEach(k=>delete SETLINK[k]);DIR.items=null;loadDir()}
  catch(err){toast(err.message);ml.disabled=false}});
const chapLine=m=>(m.chapters||[]).join(' + ')||'National';
const roleTag=m=>m.leads&&m.leads.length?(m.role==='admin'?'Club admin':'Chapter president'):'';
function dirView(v,seg){
  const f=S.dirCh||'All',q=(S.dirQ||'').toLowerCase(),chs=['All','SoCal','NorCal','Nevada'];
  const L=connFilter(DIR.items.filter(m=>(f==='All'||(m.chapters||[]).includes(f))&&(!q||m.name.toLowerCase().includes(q))));
  v.innerHTML=seg+`<h2 class="sec" style="margin-bottom:0">Members</h2><p class="sub">${DIR.items.length} club members. Names and chapters only.</p>${connPanel(DIR.items)}
   <div class="seg" style="margin-top:10px">${chs.map(c=>`<button class="chip" data-dch="${c}" aria-pressed="${f===c}">${c}</button>`).join('')}</div>
   <input class="field" id="dirQ" placeholder="Search by name" value="${esc(S.dirQ||'')}" autocomplete="off" style="margin-top:10px">
   <div class="stack" id="dirList" style="margin-top:12px">${dirRows(L)}</div>`;
}
const dirRows=L=>L.length?L.map(m=>`<button class="card mem ${m.hof?'hofcard':''}" data-dm="${esc(m.id)}">${avOf(m)}<span><b>${esc(m.name)}</b><small>${esc(chapLine(m))}${roleTag(m)?' - '+roleTag(m):''}${DIR.admin&&m.status==='suspended'?' - on hold':''}</small>${m.signedUp!==undefined?`<small class="connl ${connOf(m)}">${esc(connLine(m))}</small>`:''}${memBadges(m)?`<span style="display:block">${memBadges(m)}</span>`:''}</span><i class="ph-bold ph-caret-right" style="color:var(--muted)"></i></button>`).join(''):'<div class="empty"><i class="ph-bold ph-users-three"></i>No members match.</div>';
function alumniView(v,seg){
  const af=S.af||'all',admin=MSG.perm?MSG.perm.role==='admin':DIR.admin;
  const L=DIR.items.filter(m=>m.alum||m.hof).filter(m=>af==='all'||(af==='hof'?m.hof:m.alum))
    .sort((x,y)=>((y.hof?y.hof.year:0)-(x.hof?x.hof.year:0))||((y.hof?1:0)-(x.hof?1:0))||x.name.localeCompare(y.name));
  const nH=DIR.items.filter(m=>m.hof).length,nA=DIR.items.filter(m=>m.alum).length;
  const flt=[['all','Everyone'],['hof','Hall of Fame ('+nH+')'],['alumni','Alumni ('+nA+')']];
  v.innerHTML=seg+`<h2 class="sec" style="margin-bottom:0">Alumni &amp; Hall of Fame</h2><p class="sub">Members who played for the team, and members the club honors.</p>
   ${admin?'<div class="acts" style="margin-top:10px"><button class="btn" id="honorAdd"><i class="ph-bold ph-plus"></i> Add or edit</button></div>':''}
   <div class="seg" style="margin-top:10px">${flt.map(([k,l])=>`<button class="chip" data-af="${k}" aria-pressed="${af===k}">${l}</button>`).join('')}</div>
   ${L.length?`<div class="pcards rise">${L.map(pcardHTML).join('')}</div><p class="meta" style="margin-top:10px">Tap a card to flip it.</p>`:''}
   <div class="stack" style="margin-top:12px" hidden>${L.length?L.map(m=>`<button class="card mem ${m.hof?'hofcard':'alumcard'}" data-dm="${esc(m.id)}">${avOf(m)}<span><b>${esc(m.name)}</b><small>${m.hof?'Hall of Fame '+m.hof.year+(m.hof.honor?' - '+esc(m.hof.honor):''):'Alumni'}${m.alum&&(m.alum.pos||m.alum.yrs)?' - '+esc([m.alum.pos,m.alum.yrs].filter(Boolean).join(', ')):''}</small><span style="display:block">${memBadges(m)}</span>${(m.hof&&m.hof.note)||(m.alum&&m.alum.note)?`<small style="display:block;margin-top:4px">${esc((m.hof&&m.hof.note)||m.alum.note)}</small>`:''}</span><i class="ph-bold ph-caret-right" style="color:var(--muted)"></i></button>`).join(''):''}</div>
   ${L.length?'':`<div class="empty" style="margin-top:12px"><i class="ph-bold ph-trophy"></i>${admin?'Nobody added yet. Tap Add or edit.':'Nobody added yet. Club leaders add members here.'}</div>`}`;
}
const canLink=m=>!!S.authMe&&(S.authMe.role==='admin'||(S.authMe.leads||[]).some(c=>(m.chapters||[]).includes(c)));
const SETLINK={};
/* a member who already has a sign-in gets the same one-time link, worded as a password reset */
const hasSignIn=id=>{const m=(DIR.items||[]).find(x=>x.id===id);return !!(m&&m.signedUp)};
const linkBtns=m=>{const w=m.signedUp?'reset':'setup';return `<button class="btn ghost" data-setlink="${esc(m.id)}"><i class="ph-bold ph-chat-text"></i> Text a ${w} link</button><button class="btn ghost" data-setmail="${esc(m.id)}"><i class="ph-bold ph-envelope-simple"></i> Email a ${w} link</button><button class="btn ghost" data-setqr="${esc(m.id)}"><i class="ph-bold ph-qr-code"></i> Show a ${w} code</button>`};
const RESET_HELP='<p class="help" style="margin:0">A reset link lets them pick a new password. It works once, for 21 days. You never see their password.</p>';
async function getSetLink(id){if(!SETLINK[id])SETLINK[id]=await authCall('/admin/link',{id},authTok());return SETLINK[id]}
let qrLib=null;
function loadQR(){return qrLib||(qrLib=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='assets/vendor/qrcode-1.4.4.js';sc.onload=()=>ok(window.qrcode);sc.onerror=()=>{qrLib=null;no(new Error('Could not load the code. Check the signal and try again.'))};document.head.appendChild(sc)}))}
async function showSetQR(id){try{const [r,qr]=await Promise.all([getSetLink(id),loadQR()]),first=r.name.split(' ')[0],code=r.link.split('setup=')[1],reset=hasSignIn(id);
  const q=qr(0,'M');q.addData(r.link);q.make();
  openSheet(`<h3 style="margin:0;text-align:center">${reset?'Scan to reset your password':'Scan to set up'}, ${esc(first)}</h3>
   <p class="meta" style="text-align:center;margin:6px 0 12px">Point your phone camera at the code, tap the link, pick a ${reset?'new ':''}password.</p>
   <div style="background:#fff;padding:14px;max-width:300px;margin:0 auto">${q.createSvgTag({cellSize:6,margin:0,scalable:true})}</div>
   <p class="meta" style="text-align:center;margin:14px 0 4px">No camera? On the club site tap Sign in, First time${reset?' or forgot it':''}, I have a setup code, and type:</p>
   <p style="text-align:center;font:700 26px/1.2 ui-monospace,monospace;letter-spacing:.12em;margin:0">${esc(code.match(/.{1,4}/g).join('-'))}</p>
   <p class="meta" style="text-align:center;margin:10px 0 0">Works once, for 21 days.</p>`)}catch(err){toast(err.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-setqr]');if(b)showSetQR(b.dataset.setqr)});
const setLinkText=(r,first,reset)=>reset?`Hey ${first}, here is your link to pick a new password for the Raider Nation Golf Club app: ${r.link} It works once, for 21 days.`:`Hey ${first}, our Raider Nation Golf Club app is ready. Tap your own link, pick a password and you're in: ${r.link} Then tap Share and Add to Home Screen so it's one tap on game day.`;
/* email the same setup/reset link: opens the phone's mail app addressed to the member (David, Nov 14 2026: an email button wherever there's a text button) */
async function mailSetLink(id){try{const r=await getSetLink(id),first=r.name.split(' ')[0],reset=hasSignIn(id),m=(DIR.items||[]).find(x=>x.id===id)||{};
  location.href='mailto:'+encodeURIComponent(m.email||'')+'?subject='+encodeURIComponent(reset?'Your Raider Nation Golf Club password link':'Your Raider Nation Golf Club app link')+'&body='+encodeURIComponent(setLinkText(r,first,reset))}catch(err){toast(err.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-setmail]');if(b)mailSetLink(b.dataset.setmail)});
async function sendSetLink(id){try{const r=await getSetLink(id),first=r.name.split(' ')[0],reset=hasSignIn(id);
  const text=setLinkText(r,first,reset);
  if(navigator.share){try{await navigator.share({text});toast((reset?'Reset':'Setup')+' link ready for '+first);return}catch(e){if(e&&e.name==='AbortError')return}}
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text)}catch(e){fallbackCopy(text)}}else fallbackCopy(text);
  toast('Text for '+first+' copied. Paste it in a text. The link works once, for 21 days.')}catch(err){toast(err.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-setlink]');if(b)sendSetLink(b.dataset.setlink)});
/* ---- member profile: two views. Member view = what a member may see. Admin view = full control (every change is enforced on the server). ---- */
let ASMEM=false;
const pfD=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}};
function pfDues(d){if(!d)return{t:'Not recorded',k:''};const days=Math.floor((new Date(d+'T23:59:59')-Date.now())/864e5);
  return days<0?{t:'Lapsed since '+pfD(d),k:'duesbad'}:days<=30?{t:'Due soon. Paid through '+pfD(d),k:'dueswarn'}:{t:'Paid through '+pfD(d),k:'duesok'}}
const pfIdx=m=>m.hi?`${esc(m.hi)} <small style="color:var(--muted);font-weight:500">${m.hi_src==='manual'||!m.hi_src?'club record':esc(m.hi_src)}${m.hi_date?', as of '+esc(pfD(m.hi_date)):''}</small>`:'';
const pfCard=(t,v,x)=>`<div class="card"><div class="meta" style="margin:0">${t}</div><b>${v}</b>${x||''}</div>`;
function pfPublic(m){
  return `${roleTag(m)?pfCard('Club role',esc(roleTag(m))):''}
    ${m.home?pfCard('Home course',esc(m.home)):''}
    ${m.city?pfCard('City',esc(m.city)):''}
    ${m.hi?pfCard('Handicap index',pfIdx(m)):''}
    ${m.alum?pfCard('Played for the team'+(m.alum.no?' · #'+esc(m.alum.no):''),esc([m.alum.pos,m.alum.yrs].filter(Boolean).join(', ')||'Alumni'),(pcStats(m.alum).length?`<p class="meta">${pcStats(m.alum).map(esc).join(' · ')}</p>`:'')+(m.alum.note?`<p class="meta">${esc(m.alum.note)}</p>`:'')+(m.alum.link&&/^https:\/\//.test(m.alum.link)?`<a class="btn small ghost" style="margin-top:6px" href="${esc(m.alum.link)}" target="_blank" rel="noopener"><i class="ph-bold ph-arrow-square-out"></i> Career stats</a>`:'')):''}
    ${m.hof?pfCard('Hall of Fame, class of '+m.hof.year,esc(m.hof.honor||'Hall of Fame'),m.hof.note?`<p class="meta">${esc(m.hof.note)}</p>`:''):''}`}
function pfHeader(m){return `<div class="who" style="gap:14px">${avOf(m)}<div><h3 style="margin:0">${esc(m.name)}</h3><span class="pill">${esc(chapLine(m))}</span>${memBadges(m)?`<div>${memBadges(m)}</div>`:''}</div></div>`}
function openDirMember(id,keep){
  const m=(DIR.items||[]).find(x=>x.id===id);if(!m)return;
  if(!keep)ASMEM=false;
  const admin=DIR.admin,lead=MSG.perm&&(MSG.perm.role==='admin'||(MSG.perm.leads||[]).length>0);
  const msgBtn=lead&&!m.me&&(MSG.perm.role==='admin'||(m.chapters||[]).some(c=>(MSG.perm.leads||[]).includes(c)))?`<button class="btn full" data-msgto="${esc(m.id)}"><i class="ph-bold ph-paper-plane-tilt"></i> Message ${esc(m.name.split(' ')[0])}</button>`:'';
  const mine=m.me?`<button class="btn ghost full" data-myprofile style="margin-top:8px"><i class="ph-bold ph-pencil-simple"></i> Edit my profile</button>`:'';
  if(!admin||ASMEM){
    const pub=admin?Object.assign({},m,{city:m.show_city?m.city:'',hi:m.show_index?m.hi:''}):m;
    const leadView=!admin&&m.signedUp!==undefined;
    openSheet(`${admin?`<div class="adminstrip"><span><i class="ph-bold ph-eye"></i> This is what members see</span><button data-asadmin="${esc(m.id)}">Back to admin view</button></div>`:''}
     ${pfHeader(m)}
     <div class="stack" style="margin-top:14px">${pfPublic(pub)}
      ${leadView?`<div class="card"><div class="meta" style="margin:0">Chapter leader view (only you and the admins see this)</div>
        <b>${esc(connLine(m))}</b>
        ${m.phone?`<p class="meta">Phone ${esc(m.phone)}</p>`:''}<p class="meta ${pfDues(m.dues_to).k}">Dues: ${esc(pfDues(m.dues_to).t)}</p></div>`:''}
     </div>
     ${leadView&&canLink(m)&&!(m.me&&m.signedUp)?`<div class="acts" style="margin:8px 0">${linkBtns(m)}</div>${m.signedUp?RESET_HELP:''}`:''}
     ${msgBtn}${mine}`);
    return}
  const du=pfDues(m.dues_to);
  openSheet(`<div class="adminstrip"><span><i class="ph-fill ph-shield-check"></i> Admin view. Only leaders see this</span><button data-asmem="${esc(m.id)}">See what members see</button></div>
   ${pfHeader(m)}
   ${m.status==='suspended'?'<p class="meta duesbad" style="font-weight:700">On hold. This person cannot sign in.</p>':''}
   <div class="stack" style="margin-top:12px">${msgBtn}
    <div class="acts">${linkBtns(m)}</div>${m.signedUp?RESET_HELP:''}
    <button class="btn full" data-aedit="${esc(m.id)}"><i class="ph-bold ph-pencil-simple"></i> Edit this member</button></div>
   <details class="fold" open><summary>Contact and sign-in <i class="ph-bold ph-caret-down"></i></summary><div class="fb">
     <p class="meta">Email</p><b style="word-break:break-all">${esc(m.email||'')}</b>
     <p class="meta">Phone</p><b>${esc(m.phone||'Not given')}</b>
     <p class="meta">GHIN number</p><b>${esc(m.ghin||'None')}</b>
     <p class="meta">Handicap index</p><b>${m.hi?pfIdx(m):'None'}</b>
     <p class="meta">Sign-in</p><b>${esc(connLine(m))}</b></div></details>
   <details class="fold" open><summary>Membership <i class="ph-bold ph-caret-down"></i></summary><div class="fb">
     <p class="meta">Chapters</p><b>${esc(chapLine(m))}</b>
     <p class="meta">Club role</p><b>${m.role==='admin'?'Club admin':(m.leads&&m.leads.length?'Chapter president of '+esc(m.leads.join(' + ')):'Member')}</b>
     <p class="meta">Dues</p><b class="${du.k}">${esc(du.t)}</b></div></details>
   <details class="fold"><summary>What they chose to show <i class="ph-bold ph-caret-down"></i></summary><div class="fb">
     <p class="meta">Home course</p><b>${esc(m.home||'Not given')}</b>
     <p class="meta">City</p><b>${esc(m.city||'Not given')} ${m.city?(m.show_city?'(shown to members)':'(hidden from members)'):''}</b>
     <p class="meta">Index</p><b>${m.show_index?'Shown to members':'Hidden from members'}</b></div></details>
   <details class="fold"><summary>Alumni and Hall of Fame <i class="ph-bold ph-caret-down"></i></summary><div class="fb">
     ${m.alum||m.hof?pfPublic({alum:m.alum,hof:m.hof}):'<p class="meta">Not added yet.</p>'}
     <button class="btn ghost full" data-honor="${esc(m.id)}" style="margin-top:8px"><i class="ph-bold ph-trophy"></i> Edit</button></div></details>
   <details class="fold"><summary>Private note (leaders only) <i class="ph-bold ph-caret-down"></i></summary><div class="fb"><p>${m.note?esc(m.note):'<span class="meta">No note.</span>'}</p></div></details>
   <details class="fold" id="pfHist" data-hist="${esc(m.id)}"><summary>Change history <i class="ph-bold ph-caret-down"></i></summary><div class="fb" id="pfHistBody"><p class="meta">Opens when you tap it.</p></div></details>`);
}
const PF_LABEL={role:'role',leads:'chapter president of',chapters:'chapters',status:'status',dues_to:'dues paid through',hi:'handicap index',ghin:'GHIN number',name:'name',phone:'phone',home:'home course',city:'city',show_city:'show city',show_index:'show index',note:'private note',alum:'alumni entry',hof:'Hall of Fame entry',setup_link:'setup link'};
const pfVal=(f,v)=>f==='note'?'(updated)':Array.isArray(v)?(v.join(' + ')||'none'):(v===null||v===undefined||v==='')?'empty':typeof v==='object'?'updated':String(v).slice(0,40);
document.addEventListener('toggle',async e=>{const d=e.target;if(!d||!d.matches||!d.matches('#pfHist')||!d.open||d.dataset.done)return;d.dataset.done='1';
  try{const r=await authCall('/admin/audit?id='+encodeURIComponent(d.dataset.hist),null,authTok());
    $('#pfHistBody').innerHTML=r.items.length?r.items.map(x=>`<p class="meta" style="margin:6px 0"><b>${esc(x.actor_name)}</b> ${x.field==='setup_link'?'made a setup link':'changed '+esc(PF_LABEL[x.field]||x.field)+' from '+esc(pfVal(x.field,x.old))+' to '+esc(pfVal(x.field,x.new))}<br>${esc(new Date(x.ts*1000).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}${x.via==='self'?' (they did it themselves)':''}</p>`).join(''):'<p class="meta">No changes yet.</p>'}
  catch(err){$('#pfHistBody').innerHTML='<p class="meta">Could not load. '+esc(err.message)+'</p>'}},true);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-asmem]');if(a){ASMEM=true;openDirMember(a.dataset.asmem,true);return}
  const b=e.target.closest('[data-asadmin]');if(b){ASMEM=false;openDirMember(b.dataset.asadmin,true);return}
  const ed=e.target.closest('[data-aedit]');if(ed){const id=ed.dataset.aedit;closeSheet();setTimeout(()=>openAdminEdit(id),330);return}
  if(e.target.closest('[data-myprofile]')){closeSheet();S.spage='account';setTimeout(()=>setTab('settings'),330)}});
function openAdminEdit(id){
  const m=(DIR.items||[]).find(x=>x.id===id);if(!m||!DIR.admin)return;
  const ALL=['SoCal','NorCal','Nevada','National'],self=!!m.me;
  const cb=(nm,list,on,dis)=>list.map(c=>`<label class="check" style="margin:6px 0"><input type="checkbox" data-${nm}="${c}" ${(on||[]).includes(c)?'checked':''} ${dis?'disabled':''}> ${c}</label>`).join('');
  openSheet(`<h3 style="margin:0">Edit ${esc(m.name)}</h3>
   <form id="aeForm" novalidate>
    <label for="aeName">Name</label><input class="field" id="aeName" maxlength="60" value="${esc(m.name)}">
    <label for="aePhone">Phone</label><input class="field" id="aePhone" type="tel" maxlength="20" value="${esc(m.phone||'')}">
    <label for="aeGhin">GHIN number</label><input class="field" id="aeGhin" inputmode="numeric" maxlength="10" value="${esc(m.ghin||'')}">
    <label for="aeHi">Handicap index (from GHIN, like 12.4)</label><input class="field" id="aeHi" inputmode="decimal" maxlength="6" value="${esc(m.hi||'')}">
    <label for="aeDues">Dues paid through</label><input class="field" id="aeDues" type="date" value="${esc(m.dues_to||'')}">
    <label for="aeNote">Private note (leaders only)</label><textarea class="field" id="aeNote" maxlength="400" rows="2">${esc(m.note||'')}</textarea>
    <h4 style="margin:16px 0 4px">Chapters</h4>${cb('ch',ALL,m.chapters)}
    <h4 style="margin:16px 0 4px">Chapter president of</h4>${cb('ld',ALL.slice(0,3),m.leads,self)}
    <label for="aeRole">Club role</label><select class="field" id="aeRole" ${self?'disabled':''}><option value="member" ${m.role!=='admin'?'selected':''}>Member</option><option value="admin" ${m.role==='admin'?'selected':''}>Club admin (full control)</option></select>
    <label for="aeStat">Status</label><select class="field" id="aeStat" ${self?'disabled':''}><option value="active" ${m.status!=='suspended'?'selected':''}>Active</option><option value="suspended" ${m.status==='suspended'?'selected':''}>On hold (cannot sign in)</option></select>
    ${self?'<p class="help">You cannot change your own role, president spots or status. Another admin has to.</p>':''}
    <div id="aePw" hidden><label for="aePwIn">Type your password to confirm</label><input class="field" id="aePwIn" type="password" autocomplete="current-password"></div>
    <button class="btn full" type="submit" style="margin-top:14px"><i class="ph-bold ph-check"></i> Save</button><p class="si-msg" id="aeMsg" role="status"></p></form>`);
  const sens=()=>{const ld=[...document.querySelectorAll('[data-ld]:checked')].map(x=>x.dataset.ld);
    return $('#aeRole').value!==(m.role==='admin'?'admin':'member')||$('#aeStat').value!==(m.status==='suspended'?'suspended':'active')||ld.slice().sort().join()!==(m.leads||[]).slice().sort().join()};
  $('#aeForm').addEventListener('change',()=>{$('#aePw').hidden=!sens()});
  $('#aeForm').addEventListener('submit',async ev=>{ev.preventDefault();const msg=$('#aeMsg'),btn=ev.target.querySelector('button[type=submit]');
    const ch=[...document.querySelectorAll('[data-ch]:checked')].map(x=>x.dataset.ch),ld=[...document.querySelectorAll('[data-ld]:checked')].map(x=>x.dataset.ld);
    const want={name:$('#aeName').value,phone:$('#aePhone').value,ghin:$('#aeGhin').value,hi:$('#aeHi').value,dues_to:$('#aeDues').value,note:$('#aeNote').value,chapters:ch};
    const patch={};for(const k in want){const cur=m[k]===undefined?'':m[k];if(JSON.stringify(want[k])!==JSON.stringify(cur))patch[k]=want[k]}
    if(!self){if(JSON.stringify(ld.slice().sort())!==JSON.stringify((m.leads||[]).slice().sort()))patch.leads=ld;
      if($('#aeRole').value!==(m.role==='admin'?'admin':'member'))patch.role=$('#aeRole').value;
      if($('#aeStat').value!==(m.status==='suspended'?'suspended':'active'))patch.status=$('#aeStat').value}

/* ---------- ticket exchange (member area) ----------
   Real listings on the club server (David, Nov 13 2026: "build it for real"). Members post seats to sell or trade;
   a buyer makes an offer and the two talk in a private thread inside the app. The club never holds money or tickets:
   the seller sends them in the official team ticket app, the buyer pays after they land. Rules (price limit, trades,
   leader approval, close at kickoff) come from the server; club admins change them in Settings. */
const TIX={items:null,threads:[],rules:null,leader:false,admin:false,at:0,err:''};
const tclub=(p,b)=>window.RNGCBUCKS?RNGCBUCKS.club(p,b):Promise.reject(new Error('The club server is not set up.'));
async function loadTix(force){
  if(!force&&TIX.items&&Date.now()-TIX.at<20000)return;
  try{Object.assign(TIX,await tclub('/tix/list'),{at:Date.now(),err:''})}catch(e){TIX.err=e.message;if(!TIX.items)TIX.items=[]}
  if(S.tab==='members'&&S.mview==='tix')renderMembers();
  if(S.tab==='settings'&&S.spage==='tix')renderSettings();
  if(typeof renderSubnav==='function')renderSubnav();
}

/* kickoff in Pacific time, so a listing for a game closes itself when the game starts */
function kickMs(g){
  if(!g||g.tbd||!g.date)return 0;
  const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(g.kick||'');let h=23,mi=59;
  if(m){h=+m[1]%12+(/pm/i.test(m[3])?12:0);mi=+m[2]}
  const mo=+g.date.slice(5,7),off=mo>=4&&mo<=10?'-07:00':'-08:00';
  return Date.parse(g.date+'T'+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':00'+off)||0;
}

  try{CS.marks=(await csClub('/admin/setup',{id,done})).done||{};CS.open[id]=false;renderSettings();toast(done?'Marked complete for you and '+(csTo()==='Ross'?'Ross':'David'):'Marked not done')}
  catch(e){toast(e.message||'That did not save. Try again.');if(btn)btn.disabled=false}}
const csLeft=()=>CSETUP.filter(it=>!csDone(it)).length;
function setupNudge(){return '';if(!CS.sent){csLoad();return ''}
  const n=csLeft();if(!n)return '';
  return `<div class="card csnudge rise"><div><b>Club setup: ${n} ${n===1?'thing':'things'} left</b><p class="meta">Quick answers so the app works for the club. Each one goes straight to David.</p></div><button class="btn" data-csgo><i class="ph-bold ph-list-checks"></i> Open the checklist</button></div>`}
function csField(it,f,i,val){const id=`cs-${it.id}-${i}`,[k,label,x]=f;
  if(k==='ta')return `<div><label class="csl" for="${id}">${label}</label><textarea class="field" id="${id}" data-csf="${i}" maxlength="1500" placeholder="${esc(x||'')}">${esc(val||'')}</textarea></div>`;
  if(k==='pick'||k==='checks'){const t=k==='pick'?'radio':'checkbox',on=String(val||'').split(', ');
    return `<fieldset class="cspick"><legend>${label}</legend><div class="row">${x.map(o=>`<label class="cschip"><input type="${t}" name="${id}" value="${esc(o)}" data-csf="${i}" ${on.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></fieldset>`}
  const type={url:'url',num:'number',date:'date'}[k]||'text';
  return `<div><label class="csl" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" data-csf="${i}" ${k==='num'?'min="0" max="24" inputmode="numeric"':''} placeholder="${esc(x||'')}" value="${esc(val||'')}"></div>`}
function csVals(it,box){const v={};it.f.forEach((f,i)=>{const els=[...box.querySelectorAll(`[data-csf="${i}"]`)];
  v[i]=f[0]==='pick'||f[0]==='checks'?els.filter(e=>e.checked).map(e=>e.value).join(', '):((els[0]&&els[0].value)||'').trim()});return v}
function csCard(it,n){const done=csDone(it),open=!done||CS.open[it.id],d=it.id==='dob'?{}:(csDraft()[it.id]||{});
  const mk=CS.marks&&CS.marks[it.id],ts=mk?mk.at:(done?CS.sent[csSubj(it)]*1000:0);
  const when=done?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})+(mk&&mk.by?' · '+esc(mk.by):''):'';
  return `<div class="card cscard ${done?'done':''}" id="cs-${it.id}"><div class="cshead"><span class="csnum" aria-hidden="true">${done?'<i class="ph-bold ph-check"></i>':n}</span><div><h3 class="cardh">${it.t}</h3><p class="meta">${it.why}</p></div></div>
   ${done&&!open?`<div class="row"><span class="pill"><i class="ph-bold ph-check"></i> Complete ${when}</span><span class="grow"></span><button class="btn small ghost" data-csedit="${it.id}"><i class="ph-bold ph-pencil-simple"></i> Update</button></div>`:
   `${it.steps?`<ol class="cssteps">${it.steps.map(st=>`<li><b>${st[0]}:</b> ${esc(st[2])}.<br><a class="btn small ghost" href="${st[1]}" target="_blank" rel="noopener"><i class="ph-bold ph-arrow-square-out"></i> Open ${st[0]}</a></li>`).join('')}</ol>`:''}
    <div class="stack">${it.f.map((f,i)=>csField(it,f,i,d[i])).join('')}</div>
    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn cssend" data-cssend="${it.id}"><i class="ph-bold ph-paper-plane-tilt"></i> ${done?'Send update to '+csTo():'Send to '+csTo()}</button>
    ${mk?`<button class="btn ghost" data-csmark="${it.id}" data-on="0"><i class="ph-bold ph-arrow-counter-clockwise"></i> Mark not done</button>`:`<button class="btn ghost" data-csmark="${it.id}" data-on="1"><i class="ph-bold ph-check-circle"></i> Mark complete</button>`}</div>`}</div>`}
function setupHTML(){if(!CS.sent){csLoad();return pageHead('Club setup')+'<div class="card empty">Loading your checklist...</div>'}
  const left=csLeft(),tot=CSETUP.length,first=(S.name||'').split(' ')[0];let n=0,sec='';
  return pageHead('Club setup',left?`${tot-left} of ${tot} done. Fill one in and tap Send, or tap Mark complete when it's handled. No passwords needed.`:`All done${first?', '+esc(first):''}. Thanks! You can still change any answer.`)+
   `<div class="csbar" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${tot-left}"><i style="width:${Math.round((tot-left)/tot*100)}%"></i></div>
   <div class="stack rise">${CSETUP.map(it=>{n++;const h=it.sec!==sec?`<h3 class="shophead">${it.sec}</h3>`:'';sec=it.sec;return h+csCard(it,n)}).join('')}</div>`}
async function csSend(id,btn){const it=CSETUP.find(x=>x.id===id),box=$('#cs-'+id);if(!it||!box)return;
  const vals=csVals(it,box);if(!Object.values(vals).some(Boolean)){toast('Fill in at least one answer first.');return}
  const body=it.f.map((f,i)=>`${f[1]}: ${vals[i]||'(blank)'}`).join('\n');
  btn.disabled=true;
  try{const ppl=await authCall('/msg/people',null,authTok()),me=((S.authMe&&S.authMe.name)||'').toLowerCase();
    const to=(ppl.people||[]).find(x=>/^david\b.*blake/i.test(x.name)&&x.name.toLowerCase()!==me)||(ppl.people||[]).find(x=>/^ross\b.*ricks/i.test(x.name)&&x.name.toLowerCase()!==me);
    if(!to)throw new Error('Could not find David in the member list. Try again later.');
    await authCall('/msg/send',{to:{type:'people',ids:[to.id]},subject:csSubj(it),body,email:false},authTok());
    csKeep(id,vals);CS.sent=Object.assign({},CS.sent,{[csSubj(it)]:Math.floor(Date.now()/1000)});CS.open[id]=false;MSG.sent=null;
    try{CS.marks=(await csClub('/admin/setup',{id,done:true})).done||CS.marks}catch(e){}
    renderSettings();toast('Sent to '+to.name.split(' ')[0]+'. Thanks!')}
  catch(e){toast(e.message||'That did not send. Try again.');btn.disabled=false}}

function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

/* header logo: tap it to replay the animation; it also replays on its own every few clicks (6+ clicks and 60+ seconds apart) */
(function(){
  const lg=document.getElementById('hdrLogo');if(!lg)return;
  const STATIC=lg.getAttribute('src'),ANIM='assets/logo/rngc-ball-animated.svg',LEN=7600;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy=false,last=Date.now(),clicks=0,svg=null,url=null;
  const getSvg=()=>rngcLogo().then(t=>{svg=t});
  if(document.readyState==='complete')setTimeout(getSvg,3000);else addEventListener('load',()=>setTimeout(getSvg,3000),{once:true});
  function play(){
    if(busy||reduce)return;busy=true;last=Date.now();clicks=0;if(!svg)getSvg();
    if(url)URL.revokeObjectURL(url);
    url=svg?URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})):null;
    lg.src=url||ANIM+'?r='+Date.now();
    setTimeout(()=>{lg.src=STATIC;busy=false},LEN);
  }
  window.playLogo=play;
  /* off the home screen the logo takes you home; on the home screen it replays the animation */
  function tap(){if(S.tab!=='home'||(S.hpage||'overview')!=='overview'){closeSheet();S.openThread=null;S.hpage='overview';setTab('home');return}play()}
  lg.addEventListener('click',tap);
  lg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
  document.addEventListener('click',e=>{
    if(e.target.closest('#hdrLogo')||!e.target.closest('button,a,select'))return;
    if(++clicks>=6&&Date.now()-last>60000)play();
  });
})();


/* ---------- messages: club inbox + email (the sign-in service on the cloud server keeps the messages) ---------- */
const fmtWhen=ts=>{const d=new Date(ts*1000),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
async function loadInbox(quiet){
  const t=authTok();if(!t)return;
  try{const r=await authCall('/msg/inbox',null,t);MSG.items=r.items;MSG.unread=r.items.filter(m=>!m.read).length;
    if(!MSG.perm)MSG.perm=await authCall('/msg/people',null,t);
    if(MSG.perm.role!=='member'||(MSG.perm.leads||[]).length){try{MSG.sent=(await authCall('/msg/sent',null,t)).items}catch(e){}}
    renderSubnav();if(S.tab==='members'&&S.mview==='inbox')renderMembers()}catch(e){}}
function inboxView(v,seg){
  if(!authTok()){
    v.innerHTML=seg+`<div class="card gate rise"><i class="ph-fill ph-envelope-simple"></i><h3>Messages</h3><p>The club inbox is for signed-in members. Sign in with the email on your membership to read messages from your chapter and the club.</p><div class="acts"><button class="btn" id="realIn"><i class="ph-bold ph-sign-in"></i> Sign in</button></div></div>`;return}
  if(!MSG.items){v.innerHTML=seg+'<p class="meta" style="margin-top:14px">Loading your messages...</p>';loadInbox(true);return}
  const lead=MSG.perm&&(MSG.perm.role!=='member'||(MSG.perm.leads||[]).length);
  v.innerHTML=seg+`<h2 class="sec" style="margin-bottom:0">Messages</h2><p class="sub">${lead?'Message the club, a chapter or a member. Members can write to their club leaders.':'Messages from your chapter and the club. You can write to your club leaders.'}</p>
   <div class="acts" style="margin-top:12px"><button class="btn" id="msgNew"><i class="ph-bold ph-pencil-simple-line"></i> New message</button></div>
   <div class="stack" style="margin-top:12px">${MSG.items.length?MSG.items.map(m=>`<button class="card msgrow ${m.read?'':'unread'}" data-msg="${esc(m.id)}"><b>${esc(m.subject)}</b><small>${esc(m.from)} - ${esc(m.label)} - ${fmtWhen(m.ts)}</small><p>${esc(m.body)}</p></button>`).join(''):'<div class="empty"><i class="ph-bold ph-envelope-simple"></i>No messages yet.</div>'}</div>
   ${lead&&MSG.sent&&MSG.sent.length?`<h3 class="shophead" style="margin-top:22px">Sent</h3><div class="stack">${MSG.sent.slice(0,15).map(m=>`<div class="card"><b>${esc(m.subject)}</b><small class="meta">${esc(m.label)} - ${m.n} member${m.n===1?'':'s'}${m.emailed?', '+m.emailed+' emailed':''} - ${fmtWhen(m.ts)}</small></div>`).join('')}</div>`:''}`;
}
function openMsg(id){
  const m=(MSG.items||[]).find(x=>x.id===id);if(!m)return;
  openSheet(`<h3 style="margin:0">${esc(m.subject)}</h3><p class="meta" style="margin:4px 0 0">${esc(m.from)} - ${esc(m.label)} - ${fmtWhen(m.ts)}</p><div class="msgbody">${esc(m.body)}</div>
   ${m.join?(m.join.onList?`<button class="btn full" data-joinopen="${esc(m.join.id)}"><i class="ph-bold ph-user"></i> ${esc(m.join.name.split(' ')[0])} is on the list. Open their card</button>`:`<button class="btn full" data-joinadd="${esc(m.id)}"><i class="ph-bold ph-user-plus"></i> Add ${esc(m.join.name.split(' ')[0])} and get their link</button>`):''}
   ${m.canReply?'<button class="btn full" id="msgReply"><i class="ph-bold ph-arrow-bend-up-left"></i> Reply</button>':''}`);
  if(!m.read){m.read=true;MSG.unread=Math.max(0,MSG.unread-1);authCall('/msg/read',{id},authTok()).catch(()=>{});renderSubnav()}
  const rb=$('#msgReply');if(rb)rb.addEventListener('click',()=>openCompose({reply:m}))}
async function openCompose(o){
  o=o||{};const t=authTok();if(!t)return;
  if(!MSG.perm){try{MSG.perm=await authCall('/msg/people',null,t)}catch(e){toast('Could not load. Try again.');return}}
  const P=MSG.perm,admin=P.role==='admin',lead=admin||(P.leads||[]).length>0;
  const opts=o.reply?[['reply','Reply to '+o.reply.from]]:[
    ...(admin?[['club','Whole club'],['presidents','Chapter presidents']]:[]),
    ...(lead?(P.chapters||[]).map(c=>['chapter:'+c,c+' chapter (all members)']):[]),
    ...(lead?[['people','Pick members...']]:[]),
    ['leaders','Club leaders']];
  openSheet(`<h3 style="margin:0">${o.reply?'Reply':'New message'}</h3>
   <form id="cpForm" novalidate>
    <label for="cpTo">Send to</label><select class="field" id="cpTo" ${o.reply?'disabled':''}>${opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
    <div id="cpPick" hidden><input class="field" id="cpFind" placeholder="Search names" style="margin-top:8px"><div class="pickbox" id="cpList">${(P.people||[]).map(x=>`<label data-n="${esc(x.name.toLowerCase())}"><input type="checkbox" value="${esc(x.id)}"> ${esc(x.name)} <small class="meta">${esc(x.chapter)}</small></label>`).join('')}</div></div>
    <p class="help" id="cpCount" style="margin:6px 0 0"></p>
    <label for="cpSub">Subject</label><input class="field" id="cpSub" maxlength="90" value="${o.reply?esc(/^re:/i.test(o.reply.subject)?o.reply.subject:'Re: '+o.reply.subject):esc(o.subject||'')}" required>
    <label for="cpBody">Message</label><textarea class="field" id="cpBody" maxlength="3000" rows="6" required>${esc(o.body||'')}</textarea>
    <label class="check"><input type="checkbox" id="cpMail" checked> Also email it</label>
    ${P.emailHold?'<p class="help" style="margin:4px 0 0">Email is in test mode until launch. Messages reach inboxes now.</p>':''}
    ${lead||admin?`<label class="check"><input type="checkbox" id="cpText"> Also text it</label>
    <p class="help" style="margin:4px 0 0">${P.textReady?'Only members who turned on texts get one'+(P.textOn!=null?' ('+P.textOn+' so far)':'')+'.':'Texting is being set up. Texts are held for now.'}</p>`:''}
    <button class="btn full" type="submit" style="margin-top:12px"><i class="ph-bold ph-paper-plane-tilt"></i> Send</button>
    <p class="si-msg" id="cpMsg" role="status"></p></form>`);
  const sel=$('#cpTo'),pick=$('#cpPick'),cnt=$('#cpCount');
  const target=()=>{const v=sel.value;if(o.reply)return{type:'reply',msg:o.reply.id};
    if(v==='people')return{type:'people',ids:[...document.querySelectorAll('#cpList input:checked')].map(i=>i.value)};
    if(v.startsWith('chapter:'))return{type:'chapter',chapter:v.slice(8)};return{type:v}};
  let ct;const recount=()=>{pick.hidden=sel.value!=='people';clearTimeout(ct);ct=setTimeout(async()=>{
    const tg=target();if(tg.type==='people'&&!tg.ids.length){cnt.textContent='Pick at least one member.';return}
    try{const r=await authCall('/msg/count',{to:tg},t);cnt.textContent='Goes to '+r.n+' member'+(r.n===1?'':'s')+' ('+r.label+').'}catch(e){cnt.textContent=e.message}},150)};
  sel.addEventListener('change',recount);$('#cpList')&&$('#cpList').addEventListener('change',recount);
  $('#cpFind').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#cpList label').forEach(l=>l.hidden=!l.dataset.n.includes(q))});
  if(o.to&&[...sel.options].some(x=>x.value===o.to))sel.value=o.to;

  $('#cpForm').addEventListener('submit',async ev=>{ev.preventDefault();const m=$('#cpMsg'),b=ev.target.querySelector('button[type=submit]');
    const subject=$('#cpSub').value.trim(),body=$('#cpBody').value.trim();if(!subject||!body){m.textContent='Add a subject and a message.';return}
    b.disabled=true;m.textContent='Sending...';
    try{const r=await authCall('/msg/send',{to:target(),subject,body,email:$('#cpMail').checked,text:!!($('#cpText')&&$('#cpText').checked)},t);closeSheet();
      toast('Sent to '+r.delivered+' member'+(r.delivered===1?'':'s')+(r.emailed?', '+r.emailed+' emailed':'')+(r.texted?', '+r.texted+' texted':''));
      if(r.note)setTimeout(()=>toast(r.note),2400);MSG.items=null;MSG.sent=null;loadInbox()}catch(err){m.textContent=err.message;b.disabled=false}})}
document.addEventListener('click',e=>{

const SI=$('#signin');
function openSignIn(){SI.hidden=false;$('#siMsg').textContent='';requestAnimationFrame(()=>SI.classList.add('on'))}
function closeSignIn(){SI.classList.remove('on');setTimeout(()=>{SI.hidden=true},360)}
/* real sign-in: our own sign-in service on the cloud server holds the member list; the site only holds a sign-in token */
var AUTH='https://rngc-auth.137.184.188.41.sslip.io',TOKK='rngc-auth-token';
function authTok(){try{return localStorage.getItem(TOKK)||''}catch(e){return ''}}
function setTok(t){try{t?localStorage.setItem(TOKK,t):localStorage.removeItem(TOKK)}catch(e){}}
async function authCall(path,body,tok){
  const r=await fetch(AUTH+path,{method:body?'POST':'GET',headers:Object.assign(body?{'Content-Type':'application/json'}:{},tok?{Authorization:'Bearer '+tok}:{}),body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||'Could not reach the club sign-in. Try again.'),{status:r.status});
  return j}
function applyMe(me){
  S.member=true;S.demo=false;S.tour=-1;S.name=(me.name||'').slice(0,24);S.role=me.role;S.realRole=me.role;S.authMe=me;
  S.cfg.my.chapter=PLANS.some(p=>p.chapter===me.chapter)?me.chapter:'National';if(me.ghin)S.cfg.my.ghin=me.ghin;
  cfgSave();save()}
function signedIn(res){setTok(res.token);MSG.items=null;MSG.perm=null;MSG.sent=null;DIR.items=null;applyMe(res.me);closeSignIn();renderAll();syncTop();toast('Signed in as '+res.me.name.split(' ')[0]);loadInbox(true)}
async function signOutReal(){const t=authTok();setTok('');try{['rngc-store-buyer','rngc-evinfo','rngc-shop-want'].forEach(k=>localStorage.removeItem(k))}catch(e){}   /* shared phones: drop saved buyer and event details on sign-out */
  MSG.items=null;MSG.perm=null;MSG.sent=null;MSG.unread=0;DIR.items=null;S.authMe=null;S.realRole=null;CS.sent=null;CS.open={};if(t){try{await authCall('/auth/logout',{},t)}catch(e){}}}

/* on open: confirm a saved sign-in is still good, otherwise sign out */
(async()=>{const t=authTok();if(!t){if(S.member||S.demo){S.member=false;S.demo=false;S.tour=-1;save();renderAll();syncTop()}return}try{const r=await authCall('/auth/me',null,t);applyMe(r.me);renderAll();syncTop();loadInbox(true)}catch(err){if(err.status===401){setTok('');if(S.member&&!S.demo){S.member=false;save();renderAll();syncTop()}}}})();
